          minItems: 1
          maxItems: 16
          description: Public HTTPS reference-image URLs in PNG, JPEG or WebP; each link is checked when the task is created, and one that is not such an image (an error page, a GIF, a 404) is refused with 400. Omit for text-to-image. Not allowed with `output_format` `gif`.
          items: { type: string, format: uri, pattern: '^https://' }
        aspect_ratio:
          type: string
          enum: [auto, '1:1', '3:2', '2:3', '4:3', '3:4', '5:4', '4:5', '16:9', '9:16', '2:1', '1:2', '3:1', '1:3', '21:9', '9:21']
