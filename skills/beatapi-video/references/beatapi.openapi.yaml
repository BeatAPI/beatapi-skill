                        credits_reserved: 1.5
                        credits_charged: 1.5
                        billable_duration_seconds: 15
                        credits_settled: 1.5
                        credits_refunded: 0
                      request_id: req_abc123
                      error_code: null
                      error_message: null
                failed:
                  summary: Failed with refunded charge
                  value:
                    data:
                      id: task_8K2qA
                      object: task
                      task_kind: workflow
                      capability_id: music-video
                      capability_version: 1
                      workflow: music-video
                      status: failed
                      stage: failed
                      storyboard:
                        shots: []
                      created_at: 1782210000
                      updated_at: 1782210600
                      completed_at: 1782210600
                      output: null
                      usage:
                        credits_reserved: 1.5
                        credits_charged: 0
                        billable_duration_seconds: 15
