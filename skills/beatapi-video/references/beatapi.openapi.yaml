              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/realtime/sessions:
    post:
      operationId: createRealtimeSession
      tags: [Realtime Video]
      x-apidog-folder: Realtime Video API
      summary: Create a realtime browser session
      security:
        - BearerAuth: []
      description: |
        Reserve the selected USD amount and allocate a short-lived BeatAPI realtime session. Send a unique
        `Idempotency-Key`; retries with the same user, key, and body return the same session
        and deterministic short-lived `client_secret` without reserving funds or capacity
        twice. The browser receives only that BeatAPI secret and connects with
        `@beatapi/realtime`.

        Billing is fixed by the selected maximum duration. The BeatAPI browser runtime sends its
        first billing heartbeat only after the first remote output frame is rendered. When that
        accepted BeatAPI billing heartbeat succeeds, the Session becomes `active` and the selected
        duration is fully settled. A Session that closes or expires without an accepted billing
        heartbeat is fully refunded. Billing activation comes from the trusted transport lifecycle,
        not a caller-supplied browser event.
        Production availability remains gated until the documented commercial and capacity launch
        checks pass.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
          example: rts-create-cus_123-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_duration_seconds, allowed_origins]
              properties:
                max_duration_seconds:
                  type: integer
                  enum: [15, 60, 300]
                  description: Required maximum live session duration in seconds. The USD amount is reserved for the selected 15, 60, or 300 second tier.
                allowed_origins:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Exact browser origins allowed to use the short-lived session secret.
                  items:
                    type: string
                    format: uri
                    pattern: '^(https://[A-Za-z0-9.-]+(?::[0-9]+)?|http://(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]+)?)$'
                    description: Exact browser origin. Use HTTPS in production; HTTP is accepted only for localhost development.
                    example: https://app.example.com
                metadata:
                  type: object
                  maxProperties: 20
                  description: Optional server-defined string metadata for your own correlation. Up to 20 keys; keys are at most 64 characters and values at most 256 characters.
                  propertyNames: { maxLength: 64 }
                  additionalProperties: { type: string, maxLength: 256 }
            example:
              max_duration_seconds: 60
              allowed_origins: ["https://app.example.com"]
              metadata: { customer_id: cus_123 }
      responses:
        '201':
          description: Realtime session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSessionCreateResponse' }
              example:
                data:
                  id: rts_8K2qA
                  object: realtime.session
                  status: ready
                  client_secret: brt_live_example_short_lived_secret
                  expires_at: '2026-08-12T10:01:00.000Z'
                  max_duration_seconds: 60
                  allowed_origins: ['https://app.example.com']
                  credits: { reserved: 1.2, settled: 0, refunded: 0 }
                  request_id: req_abc123
                  created_at: '2026-08-12T10:00:00.000Z'
                  connected_at: null
                  closed_at: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Realtime Video is not enabled on this deployment (`realtime_disabled`, not retryable; no self-service action, contact support) or capacity is temporarily unavailable (`realtime_capacity_unavailable`, retryable; retry shortly with backoff, no delay is indicated).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/realtime/sessions/{session_id}:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: { type: string, pattern: '^rts_' }
    get:
      operationId: getRealtimeSession
      tags: [Realtime Video]
      x-apidog-folder: Realtime Video API
      summary: Get a realtime session
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Realtime session
          content: { application/json: { schema: { $ref: '#/components/schemas/RealtimeSessionResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Realtime session not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: closeRealtimeSession
      tags: [Realtime Video]
      x-apidog-folder: Realtime Video API
      summary: Close a realtime session
      security: [{ BearerAuth: [] }]
      description: Idempotently closes the session, clears temporary credentials, and releases account capacity.
      responses:
        '200':
          description: Realtime session closed
          content: { application/json: { schema: { $ref: '#/components/schemas/RealtimeSessionResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Realtime session not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/usage:
    get:
      operationId: getUsage
      tags: [Usage]
      x-apidog-folder: Reference/Usage & Limits
      summary: Get account usage and concurrency
      description: >-
        The account's balance, spend and breakdowns. Without `period` the counts cover the
        whole account history; with `period` they cover the window ending now, and the reply
        repeats `period`, `since` and `until` so a caller can tell which figure it got.
        `credit_balance` and `concurrency` are always current. A query parameter other than
        `period`, or a period outside the set, is refused with `400` rather than ignored.
        Authenticate with an API key or the account's personal access token (`usage:read`);
        both read the same account-wide summary.
      security:
        - BearerAuth: []
        - PersonalAccessToken: []
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d, all]
            default: all
          description: The window the counts and breakdowns cover, ending now. `all` (the default) is the whole account history.
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
              example:
                data:
                  object: usage
                  period: all
                  credit_balance: 21.6
                  total_tasks: 12
                  credits_settled: 14.4
                  credits_refunded: 9
                  concurrency:
                    limit: 2
                    active: 1
                  realtime:
                    sessions: 3
                    credits: 1.8
                    active: 1
                  by_workflow:
                    - workflow: music-video
                      tasks: 8
                      credits_settled: 9.6
                    - workflow: ecommerce-video
                      tasks: 4
                      credits_settled: 4.8
                  by_capability:
                    - task_kind: image
                      capability_id: seedream-5-pro
                      tasks: 3
                      credits_settled: 0.42
                    - task_kind: video
                      capability_id: veo-3.1
                      tasks: 2
                      credits_settled: 14
                  by_model:
                    - media_type: image
                      model: seedream-5-pro
                      tasks: 3
                      credits_settled: 0.42
                  by_api_key:
                    - api_key_id: key_abc123
                      title: Production
                      key_prefix: sk_live_abcd
                      tasks: 12
                      credits_settled: 14.4
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'

