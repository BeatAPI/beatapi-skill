  /v1/files:
    post:
      operationId: uploadFile
      tags: [Files]
      x-apidog-folder: Reference/Upload Files
      summary: Upload a file for workflow inputs
      security:
        - BearerAuth: []
      description: |
        Use file upload when your images, videos, audio, or subtitle files are not
        already hosted at public HTTPS URLs. The returned HTTPS URL can be used
        directly in `images`, `reference_videos`, `audio_url`, or `srt_url`.

        The gateway trusts the declared `Content-Type`; when the filename has an
        extension it must agree with that type. It does not inspect the file
        contents and does not read audio or video duration or image dimensions.

        Limits:
        - Images, audio and subtitles: maximum 50 MB.
        - Videos: maximum 100 MB.
        - Images: `png`, `jpg`, `jpeg`, `webp`
          (`image/png`, `image/jpeg`, `image/webp`).
        - Audio: `mp3`, `wav`, `aac`, `m4a`
          (`audio/mpeg`, `audio/wav`, `audio/aac`, `audio/mp4`).
        - Videos: `mp4`, `mov` (`video/mp4`, `video/quicktime`).
        - Subtitles: `srt` (`application/x-subrip`; `text/plain` only in a
          multipart upload whose filename ends in `.srt`).
        - Some aliases are accepted and stored under the canonical type, for
          example `image/jpg` as `image/jpeg`, `audio/mp3` as `audio/mpeg`, and
          `text/plain` (with a `.srt` filename) as `application/x-subrip`.
        - Anything else is refused with `400 bad_request`: PDF, generic text,
          octet-stream, other video containers and zip files.
        - Send either multipart form-data with a `file` field, or send the raw
          file body with the asset `Content-Type`.
        - `Content-Length` is required and is validated before BeatAPI buffers
          the request body; chunked uploads without a declared length are rejected.
        - `purpose` is ignored; the response always says `input`.
        - A file accepted here can still be refused by the model or workflow that
          uses it (duration, dimensions, format rules). Those checks happen when
          you create the task.
        - Workflow task inputs still require public HTTPS URLs. Localhost,
          private network URLs, and data URLs are not accepted.

        Refusals are `400 bad_request` with one of these messages:
        - `Content-Length is required for file uploads.`
        - `Content-Length must be a positive integer.`
        - `File exceeds the declared upload limit.`
        - `No file provided. Use multipart "file" field or a raw body.`
        - `The uploaded file is empty.`
        - `Unsupported file type. Supported uploads are png, jpg, jpeg, webp, mp3, wav, aac, m4a, mp4, mov, and srt.`
        - `File exceeds the 50 MB limit.` (`File exceeds the 100 MB limit.` for video)
        - `File exceeds the 100 MB upload limit.` (a multipart part over 100 MB)
        - `Could not read the uploaded file.`
        - `Could not read the multipart upload.`

        If the file cannot be stored, the answer is `503` with `processing_unavailable`
        ("File storage is temporarily unavailable. Retry later; nothing was stored.")
        or `result_transfer_failed` ("The file could not be stored on our side. Retry;
        nothing was stored."). Retry with backoff.
      parameters:
        - in: header
          name: Content-Length
          required: true
          description: Exact request-body length in bytes. For multipart uploads this includes multipart framing overhead.
          schema:
            type: integer
            minimum: 1
            maximum: 105906176
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [input]
                  description: Ignored by the gateway.
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/wav:
            schema: { type: string, format: binary }
          audio/aac:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
          video/mp4:
            schema: { type: string, format: binary }
          video/quicktime:
            schema: { type: string, format: binary }
          application/x-subrip:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
              example:
                data:
                  id: file_3xYz9
                  object: file
                  url: https://files.beatapi.io/u/6f1c2b9e4d0a4c589a572f0a8f3d7b11.mp3
                  key: u/6f1c2b9e4d0a4c589a572f0a8f3d7b11.mp3
                  mime_type: audio/mpeg
                  size_bytes: 1048576
                  purpose: input
                  created_at: 1782210000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'The file could not be stored: `processing_unavailable` ("File storage is temporarily unavailable. Retry later; nothing was stored.") or `result_transfer_failed` ("The file could not be stored on our side. Retry; nothing was stored."). Retryable with backoff; a 503 carries no `Retry-After` header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: processing_unavailable
                  message: File storage is temporarily unavailable. Retry later; nothing was stored.
                  retryable: true
                  request_id: req_xxx

  /v1/webhooks:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhooks]
      x-apidog-folder: Reference/Webhooks
      summary: List webhook endpoints
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Webhook endpoint list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListResponse'
              example:
                data:
                  object: list
                  data:
                    - id: wh_9aBcD
                      object: webhook_endpoint
                      url: https://example.com/beatapi-webhook
                      description: Production webhook
                      events: [task.succeeded, task.failed]
                      status: active
                      secret: whsec_example_masked
                      created_at: 1782210000
                      updated_at: 1782210000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWebhookEndpoint
      tags: [Webhooks]
      x-apidog-folder: Reference/Webhooks
      summary: Create a webhook endpoint
      security:
        - BearerAuth: []
      description: |
        The public API returns the signing secret in full at creation time. Store
        it securely; later public API responses return a masked secret. An
        authenticated dashboard owner can explicitly reveal the secret again.

        BeatAPI sends these headers with each delivery:
        - `x-beatapi-event`: `task.succeeded` or `task.failed`
        - `x-beatapi-timestamp`: Unix timestamp in seconds
        - `x-beatapi-signature`: hex HMAC-SHA256 signature

        Verify the signature by computing:
        `hmac_sha256(secret, timestamp + "." + raw_request_body)`.

        Example delivery body:

        ```json
        {
          "id": "evt_123",
          "event": "task.succeeded",
          "created_at": 1782210300,
          "data": {
            "id": "task_8K2qA",
            "object": "task",
            "workflow": "music-video",
            "status": "succeeded",
            "stage": "succeeded",
            "storyboard": {
              "shots": [
                {
                  "id": "shot_xxx",
                  "index": 0,
                  "status": "succeeded",
                  "duration_seconds": 5,
                  "prompt": "Opening lyric shot.",
                  "lyric_text": "Intro",
                  "created_at": 1782210000,
                  "updated_at": 1782210300
                }
              ]
            },
            "created_at": 1782210000,
            "updated_at": 1782210300,
            "completed_at": 1782210300,
            "output": {
              "media": [
                {
                  "type": "video",
                  "url": "https://media.beatapi.io/outputs/task_8K2qA/0.mp4",
                  "mime_type": "video/mp4"
                }
              ]
            },
            "usage": {
              "credits_reserved": 76,
              "credits_charged": 76,
              "billable_duration_seconds": 15,
              "credits_settled": 76,
              "credits_refunded": 0
            },
            "request_id": "req_abc123",
            "error_code": null,
            "error_message": null
          }
        }
        ```

        Reject old timestamps to prevent replay attacks. A 5 minute window is
        recommended. A delivery is attempted at most 3 times total: the initial
        request plus up to 2 retries, with fixed backoff windows of 1 minute and
        5 minutes. Polling
        `GET /v1/tasks/{task_id}` remains the source of truth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  pattern: '^https://'
                  description: Public HTTPS callback URL that accepts BeatAPI task events. Do not use localhost or a private-network URL.
                description:
                  type: string
                  description: Optional internal label for identifying the endpoint in your account.
                events:
                  type: array
                  description: Task events to deliver. Omit to subscribe to both `task.succeeded` and `task.failed`.
                  items:
                    type: string
                    enum: [task.succeeded, task.failed]
            example:
              url: https://example.com/beatapi-webhook
              events: [task.succeeded, task.failed]
      responses:
        '201':
          description: Webhook endpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
              example:
                data:
                  id: wh_9aBcD
                  object: webhook_endpoint
                  url: https://example.com/beatapi-webhook
                  description: Production webhook
                  events: [task.succeeded, task.failed]
                  status: active
                  secret: whsec_example_store_this_once
                  created_at: 1782210000
                  updated_at: 1782210000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/webhooks/{id}:
    get:
      operationId: getWebhookEndpoint
      tags: [Webhooks]
      x-apidog-folder: Reference/Webhooks
