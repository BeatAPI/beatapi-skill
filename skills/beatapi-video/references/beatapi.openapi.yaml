    QwenImage21Request:
      additionalProperties: false
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        aspect_ratio:
          default: auto
          enum:
          - auto
          - '1:1'
          - '4:3'
          - '3:4'
          - '3:2'
          - '2:3'
          - '16:9'
          - '9:16'
          - '21:9'
          - '9:21'
          type: string
          description: auto follows the first reference image; without images it renders
            1:1.
        background:
          default: opaque
          enum:
          - opaque
          - transparent
          type: string
          description: opaque or transparent. Transparent output requires PNG or WebP.
        enhance_prompt:
          type: boolean
          description: Rewrites the prompt before rendering. Defaults to true without images
            and false with images; no unconditional default.
        images:
          items:
            format: uri
            pattern: "^https://"
            type: string
          maxItems: 10
          minItems: 1
          type: array
          description: One to ten public HTTPS image URLs. Omit for text-to-image.
        model:
          enum:
          - qwen-image-2.1
          type: string
          description: Must be qwen-image-2.1.
        output_format:
          default: png
          enum:
          - png
          - webp
          - jpeg
          type: string
          description: Output file format. Use png or webp with transparent background;
            jpeg cannot retain alpha.
        prompt:
          maxLength: 5000
          minLength: 1
          type: string
          description: Generation or reference-editing instructions, from 1 to 5000 characters.
        resolution:
          default: 1K
          enum:
          - 1K
          - 2K
          type: string
          description: Output tier, 1K or 2K. A prompt cannot select a different tier.
        seed:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: Optional integer from 0 to 2147483647; no -1 value and no documented
            default.
      required:
      - model
      - prompt
      type: object
      x-beatapi-rules:
      - aspect_ratio auto follows the first image; without images it renders 1:1
      - enhance_prompt rewrites the prompt before rendering; it defaults to true without
        images and to false with them, where a rewrite can drop what an edit asks to keep
      - background transparent needs output_format png or webp
      allOf:
      - if:
          properties:
            background:
              const: transparent
          required:
          - background
        then:
          properties:
            output_format:
              enum:
              - png
              - webp
