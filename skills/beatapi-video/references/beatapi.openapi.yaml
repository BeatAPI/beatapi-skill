          type: string
          enum: [USD, CNY]
        credits:
          type: number
          format: double
          description: The balance the payment adds, in USD.
        payment_method: { type: string }
        created_at:
          type: integer
          description: Unix seconds.
        paid_at:
          type: [integer, 'null']
          description: Unix seconds when the payment completed.
    PaymentListResponse:
      type: object
      required: [data]
      properties:
