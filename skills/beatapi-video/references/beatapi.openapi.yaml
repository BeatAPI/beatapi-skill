            object:
              type: string
              enum: [api_key_secret]
            id: { type: string }
            key:
              type: string
              description: The full API key.
    VideoAnalysisTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [video_url, prompt]
      properties:
        video_url:
          type: string
          format: uri
          description: BeatAPI-hosted MP4 or MOV input URL returned by POST /v1/files for the current account. Maximum verified duration is 600 seconds.
        prompt:
          type: string
          minLength: 1
          maxLength: 12000
          description: Analysis instruction. Ask for timestamped output when temporal precision matters.
        analysis_depth:
          type: string
          enum: [standard, deep]
          default: standard
          description: Standard is the default low-cost route; deep uses the higher-reasoning route.
        max_output_tokens:
          type: integer
          minimum: 256
          maximum: 8192
          default: 2048
          description: Requested answer budget. Provider-reported output usage can include hidden reasoning tokens above this value; BeatAPI records the variance for audit and settles actual reported usage within the task reservation.
    MusicVideoTaskCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/StandardMusicVideoTaskCreateRequest'
        - $ref: '#/components/schemas/PremiumMusicVideoTaskCreateRequest'
      discriminator:
        propertyName: mv_tier
        mapping:
          standard: '#/components/schemas/StandardMusicVideoTaskCreateRequest'
          premium: '#/components/schemas/PremiumMusicVideoTaskCreateRequest'
    StandardMusicVideoTaskCreateRequest:
      type: object
      required: [images, audio_url]
      allOf:
        - if:
            required: [lip_sync]
            properties:
              lip_sync: { const: true }
          then:
            required: [lip_ref_url]
            properties:
              lip_ref_url: {}
      not:
        anyOf:
          - required: [mv_mode]
            properties: { mv_mode: {} }
          - required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
      properties:
        mv_tier:
          type: string
          enum: [standard]
          default: standard
          description: May be omitted to preserve the backwards-compatible Standard contract.
        images:
          type: array
          minItems: 1
          maxItems: 7
          description: Standard scene images. Provide 1-7 public HTTPS PNG, JPEG, or WebP URLs; place the primary subject or opening scene first. Upload local files through `POST /v1/files` and use the returned `data.url`.
          items: { type: string, format: uri }
        audio_url:
          type: string
          format: uri
          description: Public HTTPS audio URL; Standard audio must be 10-180 seconds.
        prompt: { type: string, maxLength: 3000, description: "Optional creative direction for story, setting, performance, camera, lighting, and pacing. Maximum 3000 characters." }
        language: { type: string, enum: [en, zh], description: Dialogue and lyric language used by the Standard workflow. }
        quality: { type: string, enum: [standard, high], default: standard, description: Generation quality tier. High quality is unavailable at 540p. }
        style: { type: string, maxLength: 200, description: "Optional concise visual style, such as cinematic, anime, documentary, or fashion editorial." }
        aspect_ratio: { type: string, enum: ['1:1', '16:9', '9:16', '4:3', '3:4'], description: Target output placement. Set explicitly for the destination player or social feed. }
        resolution: { type: string, enum: [540p, 720p, 1080p], default: 720p, description: Output resolution. 540p cannot be combined with high quality or lip sync. }
        lip_sync:
          type: boolean
          default: false
          description: Generate lip-synchronized performance. When true, `lip_ref_url` is required.
        lip_ref_url:
          type: string
          format: uri
          description: Public HTTPS close-up, front-facing face image used for Standard lip sync.
        add_subtitle: { type: boolean, default: false, description: Burn generated or supplied subtitles into the final video. }
        subtitle_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#FFFFFF', description: Subtitle text color as a six-digit hexadecimal value. Used when subtitles are enabled. }
        srt_url: { type: string, format: uri, description: Optional public HTTPS `.srt` subtitle file. Upload a local subtitle through `POST /v1/files`. }
        duration:
          type: integer
          minimum: 10
          maximum: 180
          description: Billing fallback only; detected audio duration wins.
        compose_mode:
          type: string
          enum: [auto, manual]
          default: auto
          description: Auto composes the final Music Video; manual pauses at `requires_action` so shots can be reviewed or edited before compose.
    PremiumMusicVideoTaskCreateRequest:
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/PremiumMusicVideoSingTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoSingPerformTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoDanceTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoPerformTaskCreateRequest'
      discriminator:
        propertyName: mv_mode
        mapping:
          sing: '#/components/schemas/PremiumMusicVideoSingTaskCreateRequest'
          sing_perform: '#/components/schemas/PremiumMusicVideoSingPerformTaskCreateRequest'
          dance: '#/components/schemas/PremiumMusicVideoDanceTaskCreateRequest'
          perform: '#/components/schemas/PremiumMusicVideoPerformTaskCreateRequest'
    PremiumMusicVideoTaskRequestBase:
      type: object
      required: [mv_tier, mv_mode, audio_url]
      not:
        anyOf:
          - required: [quality]
            properties: { quality: {} }
          - required: [language]
            properties: { language: {} }
          - required: [lip_sync]
            properties: { lip_sync: {} }
          - required: [lip_ref_url]
            properties: { lip_ref_url: {} }
          - required: [srt_url]
            properties: { srt_url: {} }
          - required: [compose_mode]
            properties: { compose_mode: {} }
      properties:
        mv_tier: { type: string, enum: [premium], description: Selects the Premium Music Video workflow and its mode-specific inputs. }
        mv_mode: { type: string, enum: [sing, sing_perform, dance, perform], description: Premium performance mode. Sing modes require `lip_ref_urls`; dance and perform require exactly six `images`. }
        audio_url:
          type: string
          format: uri
          description: Public HTTPS audio URL; Premium audio must be 10-300 seconds.
        prompt: { type: string, maxLength: 3000, description: "Optional creative direction for story, setting, performance, camera, lighting, and pacing. Maximum 3000 characters." }
        style: { type: string, maxLength: 200 }
        aspect_ratio: { type: string, enum: ['1:1', '16:9', '9:16', '4:3', '3:4'], description: Target output placement. Set explicitly for the destination player or social feed. }
        resolution:
          type: string
          enum: [720p]
          default: 720p
          description: Premium output is fixed to 720p.
        add_subtitle: { type: boolean, default: false, description: Burn generated subtitles into the final video. }
        subtitle_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#FFFFFF', description: Subtitle text color as a six-digit hexadecimal value. Used when subtitles are enabled. }
        duration:
          type: integer
          minimum: 10
          maximum: 300
          description: Premium billing fallback only; detected audio duration wins.
    PremiumMusicVideoSingTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [lip_ref_urls]
          properties:
            mv_mode: { type: string, enum: [sing] }
            images:
              type: array
              minItems: 0
              maxItems: 6
              description: Optional Premium scene images for sing mode. Provide up to six public HTTPS PNG, JPEG, or WebP URLs.
              items: { type: string, format: uri }
            lip_ref_urls:
              type: array
              minItems: 1
              maxItems: 2
              description: Required for sing mode. One or two public HTTPS close-up, front-facing face images for lip synchronization.
              items: { type: string, format: uri }
    PremiumMusicVideoSingPerformTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [lip_ref_urls]
          properties:
            mv_mode: { type: string, enum: [sing_perform] }
            images:
              type: array
              minItems: 0
              maxItems: 6
              description: Optional Premium scene images for sing and perform mode. Provide up to six public HTTPS PNG, JPEG, or WebP URLs.
              items: { type: string, format: uri }
            lip_ref_urls:
              type: array
              minItems: 1
              maxItems: 2
              description: Required for sing and perform mode. One or two public HTTPS close-up, front-facing face images for lip synchronization.
              items: { type: string, format: uri }
    PremiumMusicVideoDanceTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [images]
          not:
            required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
          properties:
            mv_mode: { type: string, enum: [dance] }
            images:
              type: array
              minItems: 6
              maxItems: 6
              description: Required for dance mode. Provide exactly six public HTTPS PNG, JPEG, or WebP scene images.
              items: { type: string, format: uri }
    PremiumMusicVideoPerformTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [images]
          not:
            required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
          properties:
            mv_mode: { type: string, enum: [perform] }
            images:
              type: array
              minItems: 6
              maxItems: 6
              description: Required for perform mode. Provide exactly six public HTTPS PNG, JPEG, or WebP scene images.
              items: { type: string, format: uri }
    EditMusicVideoShotRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          maxLength: 3000
        images:
          type: array
          minItems: 0
          maxItems: 6
          description: Premium tasks only. Optional replacement scene images; an empty array is treated as omitted. Standard tasks reject this field.
          items: { type: string, format: uri }
    RealtimeSession:
      type: object
      required: [id, object, status, expires_at, max_duration_seconds, allowed_origins, credits, request_id, created_at, connected_at, closed_at]
      properties:
        id:
          type: string
          pattern: '^rts_'
          description: Stable Realtime Session ID used to inspect or close the session.
        object:
          type: string
          enum: [realtime.session]
          description: Object discriminator; always `realtime.session`.
        status:
          type: string
          enum: [ready, connecting, active, closed, failed, expired]
          description: Active means BeatAPI accepted the first billing heartbeat after remote output began.
        expires_at:
          type: string
          format: date-time
          description: Time when the unconnected short-lived session credential expires.
        max_duration_seconds:
          type: integer
          enum: [15, 60, 300]
          description: Maximum selected live duration and billing tier in seconds.
        allowed_origins:
          type: array
          description: Exact browser origins authorized to use this Session.
          items:
            type: string
            format: uri
            pattern: '^(https://[A-Za-z0-9.-]+(?::[0-9]+)?|http://(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]+)?)$'
            description: Exact browser origin. Use HTTPS in production; HTTP is accepted only for localhost development.
            example: https://app.example.com
        credits:
          type: object
          required: [reserved, settled, refunded]
          description: USD reservation, settlement, and refund lifecycle for this Realtime Session. Compatibility field names are retained.
          properties:
            reserved: { type: number, format: double, multipleOf: 0.01, description: USD amount reserved when the Session is created. }
            settled: { type: number, format: double, multipleOf: 0.01, description: USD amount settled after the first accepted billing heartbeat. }
            refunded: { type: number, format: double, multipleOf: 0.01, description: USD amount refunded if the Session ends without billing activation. }
        request_id:
          type: string
          description: Correlation ID to retain for logs and BeatAPI support.
        created_at: { type: string, format: date-time, description: Time when the Session was created. }
        connected_at:
          type: [string, 'null']
          format: date-time
          description: Time of the first accepted BeatAPI billing heartbeat; null before billing activation.
        closed_at: { type: [string, 'null'], format: date-time, description: "Time when the Session closed, or null while it remains open." }
    RealtimeSessionCreated:
      allOf:
        - $ref: '#/components/schemas/RealtimeSession'
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              description: Short-lived BeatAPI browser credential returned only by POST. Never expose an sk_ API key to the browser.
              pattern: '^brt_live_'
    RealtimeSessionCreateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RealtimeSessionCreated'
          description: Created Realtime Session including the one-time short-lived browser credential.
    RealtimeSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RealtimeSession'
    FileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/File'
          description: Uploaded file metadata and the public HTTPS URL to use in later requests.
    WebhookEndpointList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    WebhookEndpointListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpointList'
    WebhookEndpointResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpoint'
          description: Created or retrieved webhook endpoint. Public API responses return the full signing secret at creation and mask it afterward; authenticated dashboard owners can explicitly reveal it again.
    DeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: string
            deleted:
              type: boolean
    CapabilityContract:
      type: object
      required: [reference, kind, id, version, status, title, description, execution, versions, validation]
      properties:
        reference: { type: string, description: 'Stable reference, `kind:id`. Copy it exactly into Inspect and Run.' }
        kind: { type: string, enum: [model, data, workflow] }
        id: { type: string }
        version: { type: string }
        status: { type: string }
        requires_topup: { type: boolean, description: 'Only on `model:` capabilities. A boolean: `true` means an account that has never topped up is refused this model with 403 `forbidden` until it does. `false` means at least one tier is open to such an account, not that every call is. Present only when the free-credit model list is on.' }
        readiness:
          type: string
          enum: [ready, runnable, listed]
          description: '`ready`: runnable, output schema and price published. `runnable`: runs through Run and the input is documented, but the output shape is not published. `listed`: not runnable through Run, or the input is undocumented.'
        title: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        entities: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: Words callers use for this capability; searchable. }
        input_schema: { type: object, additionalProperties: true, description: JSON Schema of Run `input`. }
        output_schema: { type: object, additionalProperties: true, description: JSON Schema of the result, when published. }
        schema_hash:
          type: string
          description: Sixteen hex characters fingerprinting `input_schema` and `output_schema` together. Cache a contract by it and re-inspect only when a later reply shows a different hash.
          example: 3f9c2a7d1b0e4a65
        pricing: { type: object, additionalProperties: true, description: Current retail price of one run. }
        pagination: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        errors: { type: object, additionalProperties: true }
        documentation:
          type: object
          required: [url]
          description: First-party usage guidance. Detailed Run examples appear here for selected data capabilities and are omitted from Search responses.
          properties:
            url: { type: string, format: uri }
            run_example: { type: object, additionalProperties: true }
            notes: { type: array, items: { type: string } }
        execution:
          type: object
          required: [mode, status_supported]
          properties:
            mode: { type: string, enum: [sync, async], description: '`sync` returns the result from Run; `async` returns a task to poll with operation status.' }
            status_supported: { type: boolean }
            result_location: { type: string }
        versions:
          type: object
          required: [catalog_version, contract_version]
          properties:
            catalog_version: { type: string }
            contract_version: { type: string }
            price_version: { type: string }
        validation:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [verified, partial, unknown] }
            verified_at: { type: string }
            evidence: { type: array, items: { type: string } }
    CapabilitySearchRequest:
      type: object
      properties:
        query:
          type: string
          description: 'What the user wants, as platform + action in their own words, Chinese or English: `小红书 搜索笔记`, `B站 视频评论`, `image model`. Only a platform name returns an overview; empty returns the catalogue map.'
        kind:
          type: string
          enum: [model, data, workflow]
          description: 'Optional filter. `model`: text, image, video and decision models. `data`: social media and web data. `workflow`: multi-step media jobs.'
        platform:
          type: string
          description: 'Optional platform filter, slug or name: `xiaohongshu` or `小红书`, `douyin` or `抖音`, `tiktok`, `bilibili`, `weibo`, `x`, `instagram`, `youtube`.'
        limit: { type: integer, minimum: 1, maximum: 50, default: 5, description: Results per page. }
        cursor: { type: string, description: '`next_cursor` from the previous page.' }
        view:
          type: string
          enum: [compact, full]
          default: compact
          description: '`compact`: one card per result. `full`: complete contracts; usually Inspect one reference instead.'
        group_by:
          type: string
          enum: [function]
          description: '`function`: group matches by what they do (search, content, comments, users, trends, feeds, commerce, live).'
    CapabilityCard:
      type: object
      required: [reference, kind, title, summary, execution, readiness]
      properties:
        reference: { type: string, description: Copy exactly into Inspect. }
        kind: { type: string, enum: [model, data, workflow] }
        title: { type: string }
        summary: { type: string }
        platform: { type: string }
        execution: { type: string, enum: [sync, async] }
        readiness: { type: string, enum: [ready, runnable, listed] }
        requires_topup: { type: boolean, description: 'Only on `model:` cards. A boolean: `true` means an account that has never topped up is refused this model with 403 `forbidden` until it does. `false` means at least one tier is open to such an account, not that every call is. Present only when the free-credit model list is on.' }
        price: { type: string, description: 'Human-readable price, such as `$0.03 per request`.' }
        signature: { type: string, description: 'One-line input summary, such as `keyword: string (required), page: integer, +3 more`.' }
    CapabilityGroup:
      type: object
      required: [key, label, count, examples]
      properties:
        key: { type: string, description: 'search, content, comments, users, trends, feeds, commerce, live or other; kinds and categories in the catalogue map.' }
        label: { type: string }
        count: { type: integer }
        examples:
          type: array
          items:
            type: object
            required: [reference, summary]
            properties:
              reference: { type: string }
              summary: { type: string }
              price: { type: string }
        search: { type: object, additionalProperties: true, description: Search arguments that list the whole group. }
    CapabilityNext:
      type: object
      required: [action]
      description: 'The call to make next, in the caller''s dialect: an MCP tool call `{tool, arguments}` when the request sent `X-Beat-Client: mcp`, otherwise a complete curl command. Copy it and replace the `<placeholders>`. A required field that takes only one value, such as a media model''s `model`, is already filled in, so that part copies as it is.'
      properties:
        action: { type: string, enum: [search, inspect, run, status, result, none] }
        call:
          oneOf:
            - type: string
              description: curl command against https://api.beatapi.io.
            - type: object
              required: [tool, arguments]
              properties:
                tool: { type: string, enum: [capabilities_search, capabilities_inspect, capabilities_run] }
                arguments: { type: object, additionalProperties: true }
        note: { type: string }
    CapabilitySearchPage:
      type: object
      required: [object, data, next_cursor]
      properties:
        object: { type: string, enum: [capability.list] }
        total: { type: integer }
        data:
          type: array
          description: Compact cards by default; complete contracts with `view` full.
          items:
            anyOf:
              - $ref: '#/components/schemas/CapabilityCard'
              - $ref: '#/components/schemas/CapabilityContract'
        next_cursor: { type: string, description: Empty on the last page. }
        understood:
          type: object
          description: How the query was read. `terms` counted; `ignored` matched nothing.
          properties:
            platforms: { type: array, items: { type: string } }
            terms: { type: array, items: { type: string } }
            ignored: { type: array, items: { type: string } }
        recommended:
          type: object
          description: Present on the first page of a specific query (not on an overview or an empty query) — the pick, so a caller can go straight to Run when the inputs are obvious.
          required: [reference, title, readiness, why_match, missing_inputs]
          properties:
            reference: { type: string, description: 'The top result, copied exactly.' }
            title: { type: string }
            readiness: { type: string, enum: [ready, runnable, listed] }
            price: { type: string, description: 'The card''s price text, such as `$0.0300` or `from $0.15`.' }
            why_match:
              type: object
              description: What the ranker understood — the platform it resolved and the terms that counted.
              properties:
                platforms: { type: array, items: { type: string } }
                terms: { type: array, items: { type: string } }
            missing_inputs: { type: array, items: { type: string }, description: 'The contract''s required inputs, in name order; empty when nothing is required.' }
        groups: { type: array, items: { $ref: '#/components/schemas/CapabilityGroup' }, description: Present in overview mode. }
        hints: { type: array, items: { type: string }, description: How to rephrase when nothing matched. }
        next: { $ref: '#/components/schemas/CapabilityNext' }
        catalog_features: { type: array, items: { type: string }, description: 'What this gateway announces, so a client can tell it from an older one: `requires_topup`, `next_prefill` and `media_overview`.' }
    CapabilityRunRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string, pattern: '^(model|data|workflow):.+$', description: The inspected reference, copied exactly. }
        operation:
          type: string
          enum: [start, status, result]
          default: start
          description: '`start`: run it. `status`: poll an async task (needs `task_id`; takes `view`, `max_items` and `fields` like start). `result`: fetch a finished result again, free within one hour (needs `request_id`).'
        input:
          type: object
          additionalProperties: true
          description: 'For start: the input, following the inspected `input_schema`. Text models: `{"input": "<prompt or messages>"}` with optional `instructions`, `max_output_tokens`, `temperature`. JEV: `{"state": …, "questions": …}`.'
        task_id: { type: string, description: 'For status: the task id an async start returned.' }
        request_id: { type: string, description: 'For result: the `request_id` a sync start returned.' }
        view:
          type: string
          enum: [full, preview]
          description: '`full` (REST default): the whole result. `preview`: the result''s main list lifted to `items` (the first `max_items` elements, each trimmed inside) with `items_path` and `items_total`, long strings shortened, `truncated` and `result_ref` reported.'
        max_items: { type: integer, minimum: 1, maximum: 50, description: 'With `preview`: elements kept in `items` (default 10).' }
        fields:
          type: array
          items: { type: string }
          description: 'Keep only these paths. Paths starting `items[]` are read from each element of the result''s list and returned as `items`, such as `items[].title`; other paths are dotted from the root, `[]` walks an array.'
        idempotency_key: { type: string, maxLength: 255, description: 'Unique per task, a top-level field next to `reference` and `input` (or the `Idempotency-Key` header); reuse only to retry the same start.' }
    CapabilityRunResult:
      type: object
      additionalProperties: true
      description: 'Sync data: the capability envelope (such as `social_data.call` or a web result); with `preview` its main list is in `items`. Text: `{object: text.result, model, status, output_text, usage, request_id}`. JEV: `{id, model, answers, usage}`. Async start and status (media, workflows, `data:web.research`): `{data: task, next}` with the task''s `id` and `status`; a finished data task carries its result in `data.output`.'
      properties:
        object: { type: string }
        id: { type: string, description: Task id for async kinds. }
        status: { type: string, description: 'Task status: poll until `succeeded` or `failed`.' }
        request_id: { type: string, description: 'Pass to `operation: result` to fetch the stored result.' }
        output_text: { type: string, description: Text models only. }
        answers: { type: object, additionalProperties: true, description: JEV only. }
        items: { type: array, items: {}, description: 'With `preview` or `items[]` fields: the elements of the result''s main list.' }
        items_path: { type: string, description: 'Where the list sits in the full result, such as `data.data.items` or `results`.' }
        items_total: { type: integer, description: Elements in the full list. }
        items_shown: { type: integer, description: Elements in `items`. }
        truncated: { type: boolean, description: 'True when a preview cut the result.' }
        result_ref:
          type: object
          description: The stored full result, when a view left anything out.
          properties:
            request_id: { type: string, description: 'Pass to `operation: result`.' }
            expires_at: { type: string, format: date-time }
        usage: { type: object, additionalProperties: true }
        data: { description: The result payload or the wrapped object. }
    WebSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 400
          pattern: '\S'
          description: Search query. Surrounding whitespace is trimmed before the length check.
        type:
          type: string
          enum: [web, news, images, videos, scholar, patents, shopping, places]
          default: web
          description: Result type. Each type adds its own fields to every result.
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Number of results to return.
        time_range:
          type: string
          enum: [day, week, month, year]
          description: Only results from this period. Only for `web`, `news`, `images` and `videos`.
        include_domains:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1 }
          description: Only return results from these domains. Only for `web`, `news`, `images` and `videos`.
        exclude_domains:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1 }
          description: Leave out results from these domains. Only for `web`, `news`, `images` and `videos`.
        country:
          type: string
          pattern: '^[a-z]{2}$'
          description: ISO 3166-1 alpha-2 country code in lowercase, such as `us` or `cn`. With `country` and `language` both left out, a query written in Chinese, Japanese or Korean searches in that language and region.
        language:
          type: string
          pattern: '^[a-z]{2}$'
          description: Two-letter language code, such as `en` or `zh`.
    WebSearchResult:
      type: object
      required: [position, title]
      additionalProperties: true
      description: |
        One search result. Every type returns `position` and `title`; `places` results
        have no `url` and `news` results have no `snippet`. Fields added per type:
        `news` — `source`, `published_at`, `image_url`;
        `images` — `image_url`, `thumbnail_url`, `width`, `height`, `source`;
        `videos` — `source`, `duration`, `published_at`, `image_url`;
        `scholar` — `publication_info`, `year`, `cited_by`, `pdf_url`;
        `patents` — `publication_number`, `priority_date`, `filing_date`, `grant_date`, `published_at`, `inventor`, `assignee`, `pdf_url`;
        `shopping` — `source`, `price`, `rating`, `rating_count`, `image_url`;
        `places` — `address`, `latitude`, `longitude`, `rating`, `rating_count`, `category`, `phone`, `website`.
      properties:
        position: { type: integer, minimum: 1, description: 1-based rank within this response. }
        title: { type: string }
        url: { type: string, description: Result page. Absent for `places`. }
        snippet: { type: string, description: Short excerpt. Absent for `news`. }
        published_at: { type: string, description: Publication date as the source reports it, when known. }
    WebSearchResponse:
      type: object
      required: [object, request_id, query, type, results]
      properties:
        object: { type: string, enum: [web.search] }
        request_id: { type: string, description: Quote it in support requests. }
        query: { type: string }
        type: { type: string, enum: [web, news, images, videos, scholar, patents, shopping, places] }
        results: { type: array, items: { $ref: '#/components/schemas/WebSearchResult' } }
        answer_box:
          type: object
          additionalProperties: true
          description: A direct answer, present only when the search produced one.
          properties:
            title: { type: string }
            snippet: { type: string }
            url: { type: string }
        related_searches:
          type: array
          items: { type: string }
          description: Related queries, present only when available.
        usage: { $ref: '#/components/schemas/WebCallUsage' }
    WebCallUsage:
      type: object
      description: What this call was charged, in US dollars. The same object a social-data call answers with.
      required: [billing_unit, quantity, price_usd, price_version]
      properties:
        billing_unit: { type: string, enum: [request, page], description: request for search and research; page for read (pages read) and map (URLs returned). }
        quantity: { type: integer, description: How many units the reply shows were billed. }
        price_usd: { type: string, description: The settled charge for this call, in US dollars. }
        price_version: { type: string, description: Fingerprint of the price this call was charged at. }
    WebReadRequest:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 2048, pattern: '^https?://' }
          description: |
            Pages to read. Each must be a public `http` or `https` URL without a user
            name or password, and not `localhost` or a private-network IP address.
            Duplicates are read once.
        query:
          type: string
          maxLength: 400
          description: When set, only the passages relevant to it are returned.
        format:
          type: string
          enum: [markdown, text]
          default: markdown
          description: Format of each result's `content` field, Markdown or plain text. The field is always named `content`, whatever the format.
        max_chars:
          type: integer
          minimum: 500
          maximum: 100000
          default: 20000
          description: Maximum characters returned per URL. Longer content is cut and marked `truncated`.
    WebReadResult:
      type: object
      required: [url, content, truncated]
      properties:
        url: { type: string }
        title: { type: string, description: Page title, when the page has one. }
        content: { type: string, description: Main page content in the requested format. }
        truncated: { type: boolean, description: True when the content was cut at `max_chars`. }
    WebReadFailure:
      type: object
      required: [url, reason]
      properties:
        url: { type: string }
        reason:
          type: string
          enum: [blocked, unreachable]
          description: '`blocked` — the site answered with a block or challenge page; `unreachable` — the page could not be fetched.'
    WebReadResponse:
      type: object
      required: [object, request_id, results]
      properties:
        object: { type: string, enum: [web.read] }
        request_id: { type: string, description: Quote it in support requests. }
        results: { type: array, items: { $ref: '#/components/schemas/WebReadResult' } }
        failed:
          type: array
          items: { $ref: '#/components/schemas/WebReadFailure' }
          description: URLs that could not be read. They are not charged.
        usage: { $ref: '#/components/schemas/WebCallUsage' }
    WebMapRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: '^https?://'
          description: |
            The page to start from. It must be a public `http` or `https` URL without a
            user name or password, and not `localhost` or a private-network IP address.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: At most this many URLs are returned. Each URL returned is billed.
        max_depth:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: How many links away from the starting page to follow.
        include_external:
          type: boolean
          default: false
          description: Also list links that leave the site.
        select_paths:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 200 }
          description: |
            Regular expressions over the URL path, such as `/docs/.*`. Only matching
            URLs are listed. An expression that does not compile is rejected with `400`.
        exclude_paths:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Regular expressions over the URL path. Matching URLs are left out.
    WebMapResponse:
      type: object
      required: [object, request_id, url, urls]
      properties:
        object: { type: string, enum: [web.map] }
        request_id: { type: string, description: Quote it in support requests. }
        url: { type: string, description: The starting page. }
        urls:
          type: array
          items: { type: string }
          description: URLs found from the starting page, without duplicates and at most `limit`.
        note:
          type: string
          description: Present only when urls is empty, saying what to try next (an empty map is not charged).
        usage: { $ref: '#/components/schemas/WebCallUsage' }
    WebResearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
          description: The question, in any language. Surrounding whitespace is trimmed before the length check.
        include_x:
          type: boolean
          description: Also search posts on X. Set it `true` for what people or a public figure are saying; when left out, X is searched only when the question names X, Twitter or tweets. Best effort, not a guarantee — posts appear in `sources` only when the research relied on them, so a run can return none.
    WebResearchSource:
      type: object
      required: [id, url, read_status]
      properties:
        id: { type: string, description: 'Source id, such as `source_1`. `research_notes` cite sources by it.' }
        url: { type: string }
        title: { type: string }
        published_at: { type: string, description: Publication date as the source reports it, when known. }
        author: { type: string }
        snippet: { type: string, description: Search excerpt, when one was seen. }
        content:
          type: string
          description: |
            Text of a page that was read. One call returns a limited total amount of page
            text, so a `read` source past that budget has no `content`; call
            `POST /v1/web/read` with its `url` for the full text.
        read_status:
          type: string
          enum: [read, snippet, cited, failed]
          description: |
            `read` — the page was read, and `content` holds its text unless the call's
            text budget ran out; `snippet` — only a search excerpt was seen; `cited` —
            mentioned during research but not read; `failed` — reading the page failed.
            Cite only `read` sources.
    WebResearchResponse:
      type: object
      required: [object, request_id, query, status, research_notes, sources]
      properties:
        object: { type: string, enum: [web.research] }
        request_id: { type: string, description: Quote it in support requests. }
        query: { type: string }
        status:
          type: string
          enum: [complete, partial]
          description: '`partial` — the research ran but some coverage is missing; `partial_reasons` says what.'
        research_notes:
          type: string
          description: Unverified research notes that cite sources by `id`. They are leads, not evidence.
        sources: { type: array, items: { $ref: '#/components/schemas/WebResearchSource' } }
        partial_reasons:
          type: array
          items: { type: string }
          description: |
            Present only when `status` is `partial`. Values include `search_failed`,
            `some_sources_unread`, `follow_up_failed`, `no_source_read`,
            `reader_unavailable` and `incomplete`; more may be added.
        x_search:
          type: object
          description: >-
            Present when the run searched X: how much it read. Posts reach `sources` only
            when the research relied on them, so `searches` with no X source means X was
            read and nothing was cited, while an absent `x_search` means X was not searched.
          required: [searches, posts_fetched]
          properties:
            searches: { type: integer, description: X searches the research made. }
            posts_fetched: { type: integer, description: Posts those searches returned to the research model. }
    SeoCountry:
      type: string
      pattern: '^[a-z]{2}$'
      default: us
      description: Two-letter code of the search market, such as `us`, `gb`, `de` or `jp`. About 90 markets are covered; China is not.
    SeoLanguage:
      type: string
      description: Language of the market, such as `en`, `de` or `zh-TW`. Defaults to the market's main language; a language the market does not have is rejected with `400`.
    SeoDomain:
      type: string
      minLength: 1
      description: A domain such as `example.com`. A full URL is reduced to its domain, and a leading `www.` is dropped.
    SeoLimit:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
      description: Rows to return. Every row returned is billed.
    SeoCompetitorLimit:
      type: integer
      minimum: 1
      maximum: 999
      default: 100
      description: Rows to return, up to 999. Every row returned is billed.
    SeoOffset:
      type: integer
      minimum: 0
      maximum: 10000
      default: 0
      description: Rows to skip. Add `limit` to it for the next page.
    SeoKeywordsRequest:
      type: object
      additionalProperties: false
      required: [keywords]
      properties:
        keywords:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
          description: Up to 100 keywords of up to 80 characters each. They are lowercased, and duplicates count once.
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
    SeoKeywordIdeasRequest:
      type: object
      additionalProperties: false
      required: [keywords]
      properties:
        keywords:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 80 }
          description: Up to 20 seed keywords of up to 80 characters each. They are lowercased, and duplicates count once.
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
        limit: { $ref: '#/components/schemas/SeoLimit' }
        offset: { $ref: '#/components/schemas/SeoOffset' }
    SeoDomainMarketRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
    SeoRankedKeywordsRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
        contains:
          type: string
          maxLength: 80
          pattern: '^[^%_]*$'
          description: Only keywords containing this text, ignoring case. `%` and `_` are rejected. Use it to check a domain's position for one keyword.
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
        limit: { $ref: '#/components/schemas/SeoLimit' }
        offset: { $ref: '#/components/schemas/SeoOffset' }
    SeoDomainPageRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
        limit: { $ref: '#/components/schemas/SeoLimit' }
        offset: { $ref: '#/components/schemas/SeoOffset' }
    SeoCompetitorsRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
        country: { $ref: '#/components/schemas/SeoCountry' }
        language: { $ref: '#/components/schemas/SeoLanguage' }
        limit: { $ref: '#/components/schemas/SeoCompetitorLimit' }
        offset: { $ref: '#/components/schemas/SeoOffset' }
    SeoDomainRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
    SeoBacklinksRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/SeoDomain' }
        one_per_domain:
          type: boolean
          default: true
          description: One link per linking domain. Set `false` to get every link.
        limit: { $ref: '#/components/schemas/SeoLimit' }
        offset: { $ref: '#/components/schemas/SeoOffset' }
    SeoCallUsage:
      type: object
      description: What this call was charged, in US dollars.
      required: [billing_unit, quantity, price_usd, price_version]
      properties:
        billing_unit: { type: string, enum: [request], description: Always `request`. }
        quantity:
          type: integer
          description: Always `1`. `billed_rows` says how many rows the charge covers.
        price_usd: { type: string, description: The settled charge for this call, in US dollars. }
        price_version: { type: string, description: Fingerprint of the price this call was charged at. }
    SeoKeywordRow:
      type: object
      description: One keyword. A number the data does not have is left out, never written as zero.
      properties:
        keyword: { type: string }
        search_volume: { type: integer, description: Monthly searches in this market. }
        cpc_usd: { type: number, description: 'Cost per click of paid ads, in US dollars.' }
        competition: { type: number, description: 'Advertiser competition, from 0 to 1.' }
        keyword_difficulty:
          type: number
          description: How hard the keyword is to rank for, from 0 to 100, on this data set's own scale.
        intent:
          type: string
          description: Main search intent, such as `informational` or `navigational`.
        updated_at: { type: string, description: When this keyword's data was last refreshed. }
        monthly_searches:
          type: array
          description: Search volume month by month. Only on `keyword-overview`.
          items:
            type: object
            properties:
              year: { type: integer }
              month: { type: integer }
              search_volume: { type: integer }
    SeoKeywordDifficultyRow:
      type: object
      properties:
        keyword: { type: string }
        keyword_difficulty:
          type: number
          description: How hard the keyword is to rank for, from 0 to 100, on this data set's own scale.
    SeoRankedKeywordRow:
      type: object
      description: One keyword a domain ranks for. A number the data does not have is left out, never written as zero.
      properties:
        keyword: { type: string }
        search_volume: { type: integer, description: Monthly searches in this market. }
        cpc_usd: { type: number, description: 'Cost per click of paid ads, in US dollars.' }
        competition: { type: number, description: 'Advertiser competition, from 0 to 1.' }
        keyword_difficulty:
          type: number
          description: How hard the keyword is to rank for, from 0 to 100, on this data set's own scale.
        intent:
          type: string
          description: Main search intent, such as `informational` or `navigational`.
        updated_at: { type: string, description: When this keyword's data was last refreshed. }
        position: { type: integer, description: Position among the organic results. }
        absolute_position: { type: integer, description: Position counting everything on the results page. }
        url: { type: string, description: The page that ranks. }
        title: { type: string, description: Title of that page. }
        position_seen_at: { type: string, description: When that position was recorded. Positions are a snapshot and can be weeks or months old. }
        search_traffic_estimate: { type: number, description: Estimated monthly search traffic this keyword brings the page. }
    SeoRankDistribution:
      type: object
      description: Keywords by position.
      properties:
        '1': { type: integer }
        '2-3': { type: integer }
        '4-10': { type: integer }
        '11-20': { type: integer }
        '21-30': { type: integer }
        '31-100': { type: integer }
    SeoSearchFootprint:
      type: object
      description: A search footprint. An estimate of search traffic only, not of total site visits.
      properties:
        ranking_keywords: { type: integer, description: Keywords ranking in this market. }
        search_traffic_estimate: { type: number, description: Estimated monthly search traffic. Not total site visits. }
        traffic_value_usd_estimate: { type: number, description: 'Estimated cost of buying that traffic as ads, in US dollars.' }
        rank_distribution: { $ref: '#/components/schemas/SeoRankDistribution' }
        new: { type: integer, description: Keywords that recently started ranking. }
        up: { type: integer, description: Keywords that moved up. }
        down: { type: integer, description: Keywords that moved down. }
        lost: { type: integer, description: Keywords that stopped ranking. }
    SeoTopPageRow:
      type: object
      description: One page of the domain, with its search footprint.
      properties:
        url: { type: string, description: The page. }
        ranking_keywords: { type: integer, description: Keywords ranking in this market. }
        search_traffic_estimate: { type: number, description: Estimated monthly search traffic. Not total site visits. }
        traffic_value_usd_estimate: { type: number, description: 'Estimated cost of buying that traffic as ads, in US dollars.' }
        rank_distribution: { $ref: '#/components/schemas/SeoRankDistribution' }
        new: { type: integer, description: Keywords that recently started ranking. }
        up: { type: integer, description: Keywords that moved up. }
        down: { type: integer, description: Keywords that moved down. }
        lost: { type: integer, description: Keywords that stopped ranking. }
    SeoCompetitorRow:
      type: object
      properties:
        domain: { type: string, description: The competing domain. }
        shared_keywords: { type: integer, description: Keywords both domains rank for. }
        avg_position: { type: number, description: Its average position on those keywords. }
        ranking_keywords: { type: integer, description: Keywords it ranks for in all. }
        search_traffic_estimate: { type: number, description: Its estimated monthly search traffic. }
    SeoBacklinkRow:
      type: object
      properties:
        source_url: { type: string, description: The page that links. }
        source_domain: { type: string, description: Domain of that page. }
        source_title: { type: string, description: Title of that page. }
        source_authority: { type: number, description: 'Link authority of the linking domain, from 0 to 1000.' }
        source_country: { type: string, description: Country of the linking domain. }
        target_url: { type: string, description: The page linked to. }
        anchor: { type: string, description: The link text. }
        link_type: { type: string, description: 'Kind of link, such as `anchor`.' }
        dofollow: { type: boolean, description: Whether the link passes authority. }
