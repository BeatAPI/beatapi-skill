                  task_id: task_7Qm2Xc9LpR4vT8sKa1Nf6YbH3eWdJ0uZ
                  request_id: 202610290330051234567893f9a1c2eXy7Kp2Qd
                  api_key: { id: '1287', title: production, key_prefix: sk-Ab3d }
