    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Structured BeatAPI error. Use `code` (or `retryable`) for program logic and retain `request_id` for support.
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: >-
                Stable machine-readable error code. `unauthorized` is the legacy
                name for a 401; since 2026-09-29 a 401 is `missing_api_key` or
                `invalid_api_key`, but `unauthorized` may still appear. Treat it like
                `invalid_api_key`. `method_not_allowed` is the 405 for a native `/v1` path
                that exists under other methods; the `Allow` header lists them. `result_expired` is returned only by
                `POST /v1/capabilities/run` with `operation: "result"`.
              enum:
                - bad_request
                - missing_api_key
                - invalid_api_key
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - insufficient_credits
                - idempotency_conflict
                - rate_limit_exceeded
                - content_policy_violation
                - processing_unavailable
                - processing_failed
                - processing_timeout
                - result_transfer_failed
                - result_expired
                - not_implemented
                - realtime_disabled
                - realtime_capacity_unavailable
                - realtime_session_expired
                - origin_not_allowed
                - invalid_client_secret
                - transport_not_allowed
                - internal_error
            message:
              type: string
              description: English sentence that states the cause; for `bad_request` it names the field. Written for people and logs, not for parsing.
            retryable:
              type: boolean
              description: >-
                Whether making the same call again could succeed. Present for every
                code in the public table; it may be absent only for a code outside
                the table. True for rate_limit_exceeded, internal_error,
                processing_unavailable, processing_timeout, processing_failed,
                result_transfer_failed and realtime_capacity_unavailable. False for a
                request, key or balance that must change first (bad_request,
                content_policy_violation, missing_api_key, invalid_api_key,
                unauthorized, insufficient_credits, forbidden, not_found,
                method_not_allowed, idempotency_conflict, result_expired, not_implemented,
                realtime_disabled and the other realtime credential codes).
            request_id:
              type: string
              description: Correlation ID to retain for BeatAPI support.
            retry_after_seconds:
              type: integer
              description: Seconds to wait before retrying. Sent only with a 429 `rate_limit_exceeded`, and the same value is sent in the `Retry-After` header. No other code carries it.
            docs:
              type: string
              format: uri
              description: The public Skill page that says what to do about an error. Present on errors answered by the capability endpoints (`/v1/capabilities/search`, `/v1/capabilities/inspect`, `/v1/capabilities/run`); absent on every other endpoint.
  responses:
    Unauthorized:
      description: 'No API key (`missing_api_key`), or a key that is wrong, expired, disabled or exhausted (`invalid_api_key`; the message says which). Send it as `Authorization: Bearer <key>`; the key works with or without the `sk-` prefix. Not retryable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_api_key
              message: 'Invalid or inactive API key. Send it as Authorization: Bearer <key>; the key works with or without the sk- prefix.'
              retryable: false
              request_id: req_xxx
    PersonalAccessTokenUnauthorized:
      description: 'No personal access token, or one that is unknown or expired (`unauthorized`). Send it as `Authorization: Bearer <token>`. Not retryable.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PersonalAccessTokenForbidden:
      description: An API key was sent instead of the personal access token, or the token lacks the permission this endpoint needs (`forbidden`; the message names it). Not retryable.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ApiKeyNotFound:
      description: No API key with this ID on the account (`not_found`), including another account's ID.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Malformed JSON or a field, value or combination this endpoint does not accept (`bad_request`; the message names the field), or input refused by moderation (`content_policy_violation`). Not retryable unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: images must contain 1-7 public HTTPS URLs.
              retryable: false
              request_id: req_xxx
    Forbidden:
      description: The key or account is not permitted to make this call (`forbidden`), for example a model that is not available on free credit (a top-up unlocks it), a request from outside the key's IP allowlist, or a model outside the key's group. Not retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: This model is not available on free credit. Top up to use it.
              retryable: false
              request_id: req_xxx
    RateLimited:
      description: Too many requests (`rate_limit_exceeded`, including the free-model limits). Retryable after `Retry-After` seconds (also `error.retry_after_seconds`).
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit_exceeded
              message: Too many polling requests. Poll every 5-10 seconds.
              retryable: true
              request_id: req_xxx
              retry_after_seconds: 12
    InternalError:
      description: Unexpected internal error (`internal_error`). Retryable; keep `request_id` for support if it persists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Internal error. Contact support with the request_id if the problem continues.
              retryable: true
              request_id: req_xxx
    ProcessingUnavailable:
      description: 'The request could not be completed (`processing_unavailable`, `processing_timeout`, `processing_failed` or `result_transfer_failed`). Nothing was charged. Retryable with backoff; a 503 carries no `Retry-After` header and no `retry_after_seconds`. BeatAPI does not answer 502 or 504.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: processing_unavailable
              message: This model is temporarily unavailable on our side. Retry in a few minutes or use another model; this request was not charged.
              retryable: true
              request_id: req_xxx
    NotFound:
      description: Unknown model or capability, a task that does not exist for this account, or a path that does not exist (`not_found`). Not retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: The requested resource was not found.
              retryable: false
              request_id: req_xxx
    CapabilityNotFound:
      description: Unknown capability reference. `suggestions` lists the closest published references and `next` inspects the best of them.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, retryable, request_id]
                properties:
                  code: { type: string, enum: [not_found] }
                  message: { type: string }
                  retryable: { type: boolean, enum: [false] }
                  request_id: { type: string }
                  suggestions: { type: array, items: { type: string } }
                  next: { $ref: '#/components/schemas/CapabilityNext' }
          example:
            error:
              code: not_found
              message: Capability not found. Copy a reference exactly as Search returns it.
              retryable: false
              request_id: req_xxx
              suggestions: ['data:xiaohongshu.app_v2.search_notes']
              next:
                action: inspect
                call: "curl -sS -X POST https://api.beatapi.io/v1/capabilities/inspect -H 'Content-Type: application/json' -d '{\"reference\":\"data:xiaohongshu.app_v2.search_notes\"}'"
                note: Closest published match.
    InsufficientCredits:
      description: Insufficient balance (`insufficient_credits`). The account balance is zero or below the price of this request. Top up, then send it again; not retryable before that.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: insufficient_credits
              message: Account balance is not sufficient for this task.
              retryable: false
              request_id: req_xxx
    Conflict:
      description: The `Idempotency-Key` was already used with a different request body or path within 24 hours, or the first request with it is still running (`idempotency_conflict`). Not retryable unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: idempotency_conflict
              message: This Idempotency-Key was already used with a different request body.
              retryable: false
              request_id: req_xxx
    TextBadRequest:
      description: Malformed JSON or an unsupported field (`bad_request`), or input refused by moderation (`content_policy_violation`). Not retryable unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextUnauthorized:
      description: No API key (`missing_api_key`), or a key that is wrong, expired, disabled or exhausted (`invalid_api_key`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextInsufficientCredits:
      description: Insufficient balance (`insufficient_credits`). The account balance is zero or below the price of this request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextForbidden:
      description: The key or account is not permitted to use this model (`forbidden`), for example a model that is not available on free credit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextNotFound:
      description: Unknown model (`not_found`). List the enabled models with `GET /v1/models`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextRateLimited:
      description: Too many requests (`rate_limit_exceeded`, including the free-model limits). Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextInternalError:
      description: Unexpected internal error (`internal_error`). Retryable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
    TextUnavailable:
      description: The request could not be completed (`processing_unavailable`, `processing_timeout` or `processing_failed`). Nothing was charged. Retry with backoff.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextError' }
paths:
  /v1/systemone:
    post:
      operationId: createDecision
      tags: [Decisions]
      summary: Answer typed decision questions with JEV
      description: >-
        Synchronous native decision endpoint. Send shared state, optionally with
        images in assets, and named noul, choice, score or box questions; read
        id, model, answers, and usage directly from the response (no data
        envelope and no task polling). Nouls require instructions; score accepts
        1-10 criteria; box (jev-1.14) needs an image. The models are billed by
        input tokens, images included. Inspect the
        selected model for current availability and pricing. This is the direct
        equivalent of capabilities/run with reference model:jev-1.14.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
            example:
              model: jev-1.14
              state: A user requested a reversible draft update.
              questions:
                safe_to_run:
                  type: noul
                  instructions: Is this safe to run without additional approval?
      responses:
        '200':
          description: Completed decision; no polling is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
              example:
                id: task_example_decision
                model: jev-1.14
                answers:
                  safe_to_run: { type: noul, noul: 0.95 }
