        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What happens in the video: the action, the camera, the setting, and any speech or sound. With references, say what to take from each one.' }
        images: { type: array, minItems: 1, maxItems: 2, description: 'Frames as public HTTPS URLs: one is the first frame, two the first and last frame, in that order. Images up to 20 MB each.', items: { type: string, format: uri, pattern: '^https://' } }
        reference_images: { type: array, minItems: 1, maxItems: 10, description: 'One to ten reference images as public HTTPS URLs, up to 20 MB each. Required with `reference_videos`.', items: { type: string, format: uri, pattern: '^https://' } }
        reference_videos: { type: array, minItems: 1, maxItems: 3, description: 'One to three reference videos (MP4, MOV or WebM) as public HTTPS URLs, up to 64 MB each. Need at least one entry in `reference_images`; they do not change the price.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 3, maximum: 10, default: 5, description: Requested output duration in seconds. Billed per second. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16'], default: '16:9', description: 'Output aspect ratio. Also applies to frames: choose the shape of the first frame.' }
        resolution: { type: string, enum: [720p, 1080p, 4K], default: 720p, description: Output resolution tier. Price per second depends on it. }
    GeminiOmni12FlashVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Text to video when no media is sent; `images` are frames (one is the first frame, two the first and last frame); or one to ten `reference_images` with up to three optional `reference_videos`, which need at least one reference image. `images` cannot be combined with reference inputs. Every video has a soundtrack; there is no audio switch and no reference audio.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: gemini-omni-1.2-flash, description: Must be `gemini-omni-1.2-flash`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What happens in the video: the action, the camera, the setting, and any speech or sound. With references, say what to take from each one.' }
        images: { type: array, minItems: 1, maxItems: 2, description: 'Frames as public HTTPS URLs: one is the first frame, two the first and last frame, in that order. Images up to 20 MB each.', items: { type: string, format: uri, pattern: '^https://' } }
        reference_images: { type: array, minItems: 1, maxItems: 10, description: 'One to ten reference images as public HTTPS URLs, up to 20 MB each. Required with `reference_videos`.', items: { type: string, format: uri, pattern: '^https://' } }
        reference_videos: { type: array, minItems: 1, maxItems: 3, description: 'One to three reference videos (MP4, MOV or WebM) as public HTTPS URLs, up to 64 MB each. Need at least one entry in `reference_images`; they do not change the price.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 3, maximum: 15, default: 5, description: Requested output duration in seconds. Billed per second. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16'], default: '16:9', description: 'Output aspect ratio. Also applies to frames: choose the shape of the first frame.' }
        resolution: { type: string, enum: [720p, 1080p, 4K], default: 720p, description: Output resolution tier. Price per second depends on it. }
    TaskListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [object, data, has_more]
          properties:
            object: { type: string, enum: [list] }
            data:
              type: array
              items: { $ref: '#/components/schemas/Task' }
            has_more: { type: boolean, description: Whether another page follows. }
            next_cursor:
              type: string
              description: Opaque cursor for the next page, sent back as `cursor`. Absent on the last page.
    TaskResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Task'
          description: Accepted or current BeatAPI task state.
    Usage:
      type: object
      required: [object, period, credit_balance, total_tasks, credits_settled, credits_refunded, concurrency, by_workflow, by_capability, by_model, by_api_key]
      properties:
        object:
          type: string
          enum: [usage]
        period:
          type: string
          enum: [all, 24h, 7d, 30d]
          description: The window `total_tasks`, `credits_settled`, `credits_refunded` and the breakdowns cover. `credit_balance` and `concurrency` are always current.
        since:
          type: integer
          description: Unix start of the window, inclusive. Absent when `period` is `all`.
        until:
          type: integer
          description: Unix end of the window, exclusive. Absent when `period` is `all`.
        credit_balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Current USD balance. The compatibility field name is retained; 1 Credit equals $1 USD. The balance may be negative.
        total_tasks:
          type: integer
        credits_settled:
          type: number
          format: double
          multipleOf: 0.01
        credits_refunded:
          type: number
          format: double
          multipleOf: 0.01
        concurrency:
          type: object
          required: [limit, active]
          properties:
            limit:
              type: integer
              example: 2
            active:
              type: integer
              description: Active processing tasks currently using BeatAPI processing resources. Music Video storyboard_ready and requires_action tasks can have settled USD usage without counting toward this value.
        by_workflow:
          type: array
          description: Compatibility view containing workflow tasks only. Image, video, and Effect tasks are reported under by_capability instead.
          items:
            type: object
            required: [workflow, tasks, credits_settled]
            properties:
              workflow:
                type: string
                enum: [music-video, ecommerce-video, video-analysis]
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_capability:
          type: array
          items:
            type: object
            required: [task_kind, capability_id, tasks, credits_settled]
            properties:
              task_kind:
                type: string
                enum: [workflow, effect, image, video]
              capability_id:
                type: string
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_model:
          type: array
          items:
            type: object
            required: [media_type, model, tasks, credits_settled]
            properties:
              media_type:
                type: string
                enum: [image, video]
              model:
                type: string
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_api_key:
          type: array
          items:
            type: object
            required: [api_key_id, title, key_prefix, tasks, credits_settled]
            properties:
              api_key_id: { type: string }
              title: { type: string }
              key_prefix: { type: string }
              tasks: { type: integer }
              credits_settled: { type: number, format: double, multipleOf: 0.01 }
        realtime:
          type: object
          required: [sessions, credits, active]
          properties:
            sessions:
              type: integer
              description: Total BeatAPI realtime sessions for this account.
            credits:
              type: number
              format: double
              multipleOf: 0.01
              description: USD amount settled by connected realtime sessions.
            active:
              type: integer
              description: Realtime sessions in ready, connecting, or active state.
    UsageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Usage'
    UsageRecord:
      type: object
      required: [object, id, type, model, api_key, status, created_at, currency, credits_charged, credits_refunded, usage]
      properties:
        object:
          type: string
          enum: [usage_record]
        id:
          type: string
          description: The task ID for a task, otherwise the request ID.
        type:
          type: string
          enum: [text, image, video, workflow, data, realtime, other]
        model:
          type: string
          description: Public model ID.
        task_id:
          type: string
          description: Present for tasks.
        request_id:
          type: string
          description: Request ID of the call that created the record, when known.
        api_key:
          type: [object, 'null']
          description: The API key that paid; `null` for Dashboard playground use.
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
            key_prefix:
              type: string
              description: The first four characters of the key.
        status:
          type: string
          enum: [queued, processing, succeeded, failed, refunded]
          description: '`refunded` means the whole charge came back.'
        created_at:
          type: integer
          description: Unix seconds.
        currency:
          type: string
          enum: [USD]
        credits_charged:
          type: number
          format: double
          description: What the account paid in USD, after discounts and any settlement; up to six decimal places.
        credits_refunded:
          type: number
          format: double
          description: USD returned to the balance.
        usage:
          type: object
          description: Billable quantities; each member appears only for the record types it describes.
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cached_tokens: { type: integer }
            cache_write_tokens: { type: integer }
            images: { type: integer }
            seconds: { type: integer }
            resolution: { type: string }
    UsageRecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UsageRecord'
    UsageRecordListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [object, data, has_more]
          properties:
            object:
              type: string
              enum: [list]
            data:
              type: array
              items:
                $ref: '#/components/schemas/UsageRecord'
            has_more:
              type: boolean
            next_cursor:
              type: string
              description: Pass as `cursor` to read the next page; absent on the last page.
    Account:
      type: object
      required: [object, id, username, display_name, email, credit_balance, currency]
      properties:
        object:
          type: string
          enum: [account]
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        credit_balance:
          type: number
          format: double
          description: Current balance in USD.
        currency:
          type: string
          enum: [USD]
    AccountResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Account'
    NotificationSettings:
      type: object
      required: [object, type, threshold_credits, effective_threshold_credits, default_threshold_credits, notification_email, account_email]
      properties:
        object:
          type: string
          enum: [notification_settings]
