      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: minimax-h3-max-turbo, description: Must be `minimax-h3-max-turbo`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What should happen in the shot — the motion, the expression, the camera.' }
        images: { type: array, minItems: 1, maxItems: 2, description: 'Public HTTPS images. One starts the render from a first frame; a second becomes the last frame, in first-to-last order.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 5, maximum: 15, default: 5, description: 'Requested output duration in seconds, a whole number from 5 to 15. Billed per second at the rate for the chosen resolution.' }
        resolution: { type: string, enum: ['480p', '768p', '1080p'], default: '768p', description: 'Output resolution, one of the three values this model accepts. Price scales with it.' }
        seed: { type: integer, minimum: 0, maximum: 4294967295, description: Reuse a seed to re-render the same motion. A random seed is chosen when omitted. }
    GeminiOmni11FlashVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Text to video when no media is sent; `images` are frames (one is the first frame, two the first and last frame); or one to ten `reference_images` with up to three optional `reference_videos`, which need at least one reference image. `images` cannot be combined with reference inputs. Every video has a soundtrack; there is no audio switch and no reference audio.'
