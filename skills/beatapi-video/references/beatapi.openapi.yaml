openapi: 3.1.0
info:
  title: BeatAPI Developer API
  version: 1.0.0-launch
  license:
    name: BeatAPI Terms of Service
    url: https://beatapi.io/terms-of-service
  description: |
    BeatAPI provides one API key for public text models, image generation, video generation,
    video analysis, Effects, asynchronous video workflows, and short-lived Realtime Video Sessions.

    For asynchronous operations, create a task, poll the shared task endpoint or receive webhook events,
    and read hosted output URLs from `output.media`. For Realtime, create a Session on a trusted server
    with your Bearer API key and pass only the returned short-lived `client_secret` to the browser.

    Customer balances and usage are USD-denominated. Compatibility fields such
    as `credit_balance` and `credits_reserved` remain in the API; 1 Credit = $1 USD.

    ## 5 minute Quick Start

    1. Set your base URL to `https://api.beatapi.io`.
    2. Create an API key in [Dashboard → API Keys](https://beatapi.io/dashboard/apikeys)
       and send it as
       `Authorization: Bearer <BEATAPI_API_KEY>`.
       USD balance top-ups are available from
       [Dashboard → Billing](https://beatapi.io/dashboard/billing).
    3. Use public HTTPS URLs for input media. If your files are local, upload
       them with `POST /v1/files` first.
    4. Create a workflow task.
    5. Poll `GET /v1/tasks/{task_id}`, waiting the `poll_after_seconds` the response gives between calls, until `status` is `succeeded` or `failed`.
    6. Add webhooks later if you do not want to poll.

    ```bash
    read -rsp "BeatAPI API key: " BEATAPI_API_KEY && echo
    export BEATAPI_API_KEY

    curl https://api.beatapi.io/v1/workflows

    curl https://api.beatapi.io/v1/music-video/tasks \
      -H "Authorization: Bearer $BEATAPI_API_KEY" \
      -H "Content-Type: application/json" \
      -d '{
        "images": ["https://cdn.beatapi.io/samples/neon-singer.png"],
        "audio_url": "https://cdn.beatapi.io/samples/neon-singer-preview.mp3",
        "prompt": "Neon rooftop performance with cinematic light trails.",
        "language": "en",
        "resolution": "720p"
      }'

    curl https://api.beatapi.io/v1/tasks/task_8K2qA \
      -H "Authorization: Bearer $BEATAPI_API_KEY"
    ```

    ## How tasks work

    A task starts as `queued` or `processing`. Keep polling
    `GET /v1/tasks/{task_id}` every 5-10 seconds with a little jitter. Stop when
    the task is `succeeded` or `failed`.

    - `queued`: accepted and waiting for platform capacity.
    - `processing`: generation is running.
    - `storyboard_ready`: Music Video storyboard shots are available.
    - `requires_action`: choose storyboard shots and call compose.
    - `editing`: a storyboard shot edit is running.
    - `composing`: selected storyboard shots are being composed.
    - `succeeded`: output is ready in `output.media[]`.
    - `failed`: no usable output was produced. Read `error` (`code`, `message`,
      `retryable`) and `usage` for the final task result. The flat `error_code`,
      `error_message` and `retryable` carry the same values.

    The current 10 minute processing window is an operational timeout for launch
    testing, not a completion SLA.

    ## Inputs and limits

    Public workflow inputs must use HTTPS URLs that are reachable from the
    public internet. Localhost, private network URLs, and data URLs are rejected.
    Use `POST /v1/files` for local images, audio, subtitles, or Motion Control reference videos.

    Each verified new user account starts with a $2 welcome balance that never expires and
    1 active processing concurrency. Lifetime paid purchases unlock higher limits:
    $10+ = 2, $100+ = 5, $1,000+ = 10, $5,000+ = 15, and $20,000+ = 30.
    `GET /v1/usage` returns current usage totals, concurrency limit, and active
    processing task count. Active concurrency measures tasks that are currently
    using BeatAPI processing resources. storyboard_ready and requires_action
    tasks can have settled USD usage but do not count toward active processing
    concurrency.

    ## Webhooks are optional

    Polling is the simplest integration path. If you add webhooks, BeatAPI sends
    `task.succeeded` and `task.failed` events. Webhook delivery failures do not
    change task status; polling remains the source of truth.
servers:
  - url: https://api.beatapi.io
externalDocs:
  description: BeatAPI documentation
  url: https://docs.beatapi.io
tags:
  - name: Workflows
    description: Discover the workflow IDs available for task creation.
  - name: Music Video
    description: Create music video tasks from images, audio, and optional creative controls.
  - name: Effects
    description: Discover versioned effects and create image or video effect tasks.
  - name: Generation
    description: Discover BeatAPI generation models and create image or video tasks.
  - name: Text
    description: Discover enabled text models and call them through OpenAI, Anthropic, or Gemini-compatible request formats.
  - name: Ecommerce Video
    description: Create product ad video tasks from product images and duration.
  - name: Video Analysis
    description: Analyze uploaded videos with standard or deep multimodal reasoning.
  - name: Tasks
    description: Poll task status and read output URLs.
  - name: Usage
    description: Inspect task totals and account concurrency.
  - name: Account
    description: Read your account and balance, manage API keys and read payments with a personal access token.
  - name: Realtime Video
    description: Create and manage short-lived BeatAPI browser sessions for live AI video effects.
  - name: Files
    description: Upload local assets and use the returned HTTPS URL as workflow input.
  - name: Webhooks
    description: Manage optional completion callbacks.
  - name: Pricing
    description: Read the anonymous price list and compare a BeatAPI price with other platforms. No API key.
  - name: Moderation
    description: Check text and images against seven content categories and get an allow, review or block verdict.
  - name: Decisions
    description: Typed answers with a probability, from the JEV decision models.
  - name: Web Search
    description: Search the web, read pages as Markdown or plain text, list the pages of a site and research a question.
  - name: SEO
    description: Keyword data, domain rankings and backlinks. Every tool answers in the response.
  - name: SEO Site Metrics
    description: Domain Rating and site traffic. Every tool answers in the response.
  - name: Capabilities
    description: 'Start here: one Search → Inspect → Run loop covers every BeatAPI capability — social media data, text, image, video and decision models, web search and workflows.'
webhooks:
  taskCompleted:
    post:
      operationId: receiveBeatApiTaskEvent
      tags: [Webhooks]
      summary: Receive a BeatAPI task completion event
      description: |
        BeatAPI sends this request to each active endpoint subscribed to the event.
        Verify `x-beatapi-signature` against the exact request body and use polling
        as the source of truth if delivery is delayed or fails.
      security: []
      parameters:
        - in: header
          name: x-beatapi-event
          required: true
          schema: { type: string, enum: [task.succeeded, task.failed] }
        - in: header
          name: x-beatapi-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: x-beatapi-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
            example:
              id: evt_123
              event: task.succeeded
              created_at: 1782210300
              data:
                id: task_8K2qA
                object: task
                task_kind: video
                capability_id: seedance-2.5
                capability_version: 1
                media_type: video
                model: seedance-2.5
                status: succeeded
                stage: succeeded
                created_at: 1782210000
                updated_at: 1782210300
                completed_at: 1782210300
                output:
                  media:
                    - type: video
                      url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                      mime_type: video/mp4
                  url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                  r2_url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                usage:
                  credits_reserved: 1.35
                  credits_charged: 1.35
                  billable_duration_seconds: 5
                  credits_settled: 1.35
                  credits_refunded: 0
                request_id: req_abc123
                error_code: null
                error_message: null
      responses:
        '200': { description: Event accepted }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_xxx
      description: 'Send your API key as `Authorization: Bearer <BEATAPI_API_KEY>`.'
    PersonalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: nap_xxx
      description: 'Send the account''s personal access token as `Authorization: Bearer <token>`. Create it on the Dashboard''s Account security page. API keys are not accepted.'
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Anthropic-compatible API key header. Use a BeatAPI API key.
    GoogleApiKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gemini-compatible API key header. Use a BeatAPI API key.
    GoogleApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Gemini SDK compatibility only. Prefer the x-goog-api-key header when possible.
  parameters:
    BeatClient:
      in: header
      name: X-Beat-Client
      required: false
      schema: { type: string, enum: [http, mcp], default: http }
      description: 'Dialect of `next`: `http` (default) writes a curl command, `mcp` writes a capabilities tool call. The BeatAPI MCP server sends `mcp`.'
  schemas:
    DecisionEntry:
      description: A criterion description; text, JSON object, array, or null.
      oneOf:
        - { type: string }
        - { type: object, additionalProperties: true }
        - { type: array, items: {} }
        - { type: 'null' }
    DecisionInstructions:
      description: The question in words, or structured instructions. Required for noul.
      oneOf:
        - { type: string, minLength: 1, pattern: '\S' }
        - { type: object, additionalProperties: true }
        - { type: array, minItems: 1, items: {} }
    DecisionNoulQuestion:
      type: object
      required: [type, instructions]
      properties:
        type: { type: string, enum: [noul] }
        instructions: { $ref: '#/components/schemas/DecisionInstructions' }
        criteria:
          description: Optional descriptions of true and false.
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                'true': { $ref: '#/components/schemas/DecisionEntry' }
                'false': { $ref: '#/components/schemas/DecisionEntry' }
            - { type: 'null' }
    DecisionChoiceQuestion:
      type: object
      required: [type, criteria]
      properties:
        type: { type: string, enum: [choice] }
        instructions:
          oneOf:
            - { $ref: '#/components/schemas/DecisionInstructions' }
            - { type: 'null' }
        criteria:
          type: object
          minProperties: 1
          maxProperties: 255
          additionalProperties: { $ref: '#/components/schemas/DecisionEntry' }
          description: Option key to its meaning; one call can rank many options.
    DecisionScoreQuestion:
      type: object
      required: [type, criteria]
      properties:
        type: { type: string, enum: [score] }
        instructions:
          oneOf:
            - { $ref: '#/components/schemas/DecisionInstructions' }
            - { type: 'null' }
        criteria:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/DecisionEntry' }
          description: Ordered scale labels, lowest first. More than 10 is rejected.
    DecisionBoxQuestion:
      type: object
      required: [type]
      description: Locates what the instructions describe in the request's image. jev-1.14 only; the request needs an image in assets.
      properties:
        type: { type: string, enum: [box] }
        instructions: { $ref: '#/components/schemas/DecisionInstructions' }
    DecisionAsset:
      type: object
      required: [format, data_base64]
      properties:
        type: { type: string, enum: [image] }
        format: { type: string, enum: [png, jpg, jpeg] }
        data_base64:
          type: string
          minLength: 1
          description: Standard base64 of the image bytes, without a data URL prefix.
    DecisionRequest:
      type: object
      required: [state, questions]
      properties:
        model:
          type: string
          default: jev-1.14
          description: Use a published decision model, jev-1.14 or jev-1.13 (both follow TypeSafe's current release).
        state:
          description: Shared application state. Billed once across all named questions.
          oneOf:
            - { type: string, minLength: 1, pattern: '\S' }
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/DecisionNoulQuestion' }
              - { $ref: '#/components/schemas/DecisionChoiceQuestion' }
              - { $ref: '#/components/schemas/DecisionScoreQuestion' }
              - { $ref: '#/components/schemas/DecisionBoxQuestion' }
        assets:
          type: object
          minProperties: 1
          description: >-
            Images, each under a reference string that you also write in state,
            instructions or criteria where the picture belongs. PNG or JPEG, 280
            to 1568 px a side, up to 16 MiB each; the whole body up to 32 MiB.
            Images are billed as input tokens. JSON only; multipart is not accepted.
          additionalProperties: { $ref: '#/components/schemas/DecisionAsset' }
        stream:
          type: boolean
          enum: [false]
          description: Only false is supported; decisions are synchronous and never stream.
    DecisionResponse:
      type: object
      required: [id, model, answers, usage]
      properties:
        id: { type: string, description: Identifier for the completed decision. }
        model: { type: string }
        answers:
          type: object
          description: One typed answer per question name, without a data envelope.
          additionalProperties:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [noul, choice, score, box] }
              noul: { type: number, minimum: 0, maximum: 1, description: Likelihood of yes. }
              box:
                type: object
                description: Edges as fractions of the image's height and width, 0-1, measured from the top and the left.
                properties:
                  top: { type: number }
                  bottom: { type: number }
                  left: { type: number }
                  right: { type: number }
              choice: { type: string, description: Chosen option key. }
              score: { type: number, description: Continuous zero-based position on the scale. }
              probabilities:
                type: object
                additionalProperties: { type: number }
              confidence: { type: [number, 'null'] }
              legend:
                type: object
                additionalProperties: {}
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
    TextModelId:
      type: string
      description: Public text model id exposed by BeatAPI. Call GET /v1/models to discover the models enabled for your environment.
    TextModel:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id: { $ref: '#/components/schemas/TextModelId' }
        object: { type: string, const: model }
        created: { type: integer, example: 1788220800 }
        owned_by: { type: string, const: beatapi }
    TextModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: '#/components/schemas/TextModel' }
    TextPassthroughRequest:
      type: object
      description: SDK-compatible text request. BeatAPI preserves the supported fields of the chosen wire format and streams the matching response format back.
      required: [model]
      properties:
        model: { $ref: '#/components/schemas/TextModelId' }
      additionalProperties: true
    TextPassthroughResponse:
      type: object
      description: Response body in the selected SDK-compatible wire format.
      additionalProperties: true
    TextError:
      description: >-
        Text endpoint error in the native wire format, so an SDK raises its usual
        exception: the OpenAI shape on /v1/models, /v1/chat/completions,
        /v1/responses and the Gemini-compatible endpoint, the Anthropic shape on
        /v1/messages. The HTTP status and the
        English message follow the same code table as every other BeatAPI endpoint.
      oneOf:
        - $ref: '#/components/schemas/OpenAITextError'
        - $ref: '#/components/schemas/AnthropicTextError'
    OpenAITextError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, description: English sentence that states the cause. }
            type: { type: string }
            code: { type: string, description: 'BeatAPI error code, for example `insufficient_credits` or `rate_limit_exceeded`.' }
    AnthropicTextError:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string, description: English sentence that states the cause. }
    Workflow:
      type: object
      required: [id, object, name, description]
      properties:
        id:
          type: string
          enum: [music-video, ecommerce-video, video-analysis]
          example: music-video
        object:
          type: string
          enum: [workflow]
        name:
          type: string
          example: Music Video API
        description:
          type: string
    TaskStatus:
      type: string
      enum: [queued, processing, storyboard_ready, requires_action, editing, composing, succeeded, failed]
    StoryboardShot:
      type: object
      required: [id, index, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: BeatAPI shot id. Use this id for media retrieval, edit, and compose operations.
          example: shot_xxx
        index:
          type: integer
          description: Zero-based shot order in the storyboard.
          example: 0
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Current lifecycle state for this storyboard shot.
        duration_seconds:
          type: integer
          description: Planned or generated shot duration in seconds.
          example: 5
        prompt:
          type: string
          description: Creative instruction used to generate this shot.
          example: Opening lyric shot.
        lyric_text:
          type: string
          description: Lyric segment aligned with this shot when available.
          example: Intro
        media:
          type: object
          description: Present only after the shot media has been materialized or after a shot edit finishes.
          properties:
            type:
              type: string
              description: Hosted media type for the materialized shot.
              example: video
            url:
              type: string
              format: uri
              description: BeatAPI-hosted HTTPS URL for the materialized shot.
              example: https://media.beatapi.io/outputs/task_8K2qA/shots/0.mp4
            mime_type:
              type: string
              description: MIME type of the hosted shot media.
              example: video/mp4
        created_at:
          type: integer
          description: Unix timestamp when the shot record was created.
          example: 1782210000
        updated_at:
          type: integer
          description: Unix timestamp when the shot record last changed.
          example: 1782210300
    Storyboard:
      type: object
      required: [shots]
      properties:
        shots:
          type: array
          description: Ordered Music Video storyboard shots. The array may be empty before storyboard generation completes.
          items:
            $ref: '#/components/schemas/StoryboardShot'
    ShotMedia:
      type: object
      required: [object, task_id, shot_id, index, status, media, created_at, updated_at, request_id]
      properties:
        object:
          type: string
          enum: [shot_media]
        task_id:
          type: string
          example: task_8K2qA
        shot_id:
          type: string
          example: shot_xxx
        index:
          type: integer
          example: 0
        status:
          $ref: '#/components/schemas/TaskStatus'
        media:
          type: object
          required: [type, url, mime_type]
          properties:
            type:
              type: string
              enum: [video]
            url:
              type: string
              format: uri
              example: https://media.beatapi.io/outputs/task_8K2qA/shots/shot_xxx/current.mp4
            mime_type:
              type: string
              example: video/mp4
        created_at:
          type: integer
          example: 1782210000
        updated_at:
          type: integer
          example: 1782210300
        request_id:
          type: string
          example: req_abc123
    TaskUsage:
      type: object
      required: [credits_reserved, credits_settled, credits_refunded, credits_charged]
      properties:
        credits_reserved:
          type: number
          format: double
          multipleOf: 0.01
          description: USD amount reserved for this task. The compatibility field name is retained; 1 Credit equals $1 USD.
        credits_charged:
          type: number
          format: double
          multipleOf: 0.01
          description: USD amount charged. `0` on a failed task, because the reserved amount was returned.
        billable_duration_seconds:
          type: integer
          description: Server-detected or request-declared billable duration used for USD calculation.
        credits_settled:
          type: number
          format: double
          multipleOf: 0.01
          description: USD amount settled after successful work.
        credits_refunded:
          type: number
          format: double
          multipleOf: 0.01
          description: USD amount returned after a failed task. On a failed task `credits_reserved` is the amount held at create, `credits_charged` and `credits_settled` are `0`, and `credits_refunded` is the amount returned.
    Task:
      type: object
      required: [id, object, task_kind, capability_id, capability_version, status, stage, created_at, updated_at, completed_at, output, usage, request_id, error_code, error_message]
      properties:
        id:
          type: string
          description: Stable BeatAPI task ID used for polling and support.
          example: task_8K2qA
        object:
          type: string
          enum: [task]
          description: Object discriminator; always `task`.
        task_kind:
          type: string
          enum: [workflow, effect, image, video, data]
          description: Public task family that determines which capability fields are present. `data` is a data capability run as a task (`data:web.research`), polled through `POST /v1/capabilities/run`.
        capability_id:
          type: string
          description: Stable BeatAPI workflow, Effect, generation model, or data capability ID (such as `web.research`) selected when the task was accepted.
        capability_version:
          type: integer
          description: Always `1`.
        workflow:
          type: string
          enum: [music-video, ecommerce-video, video-analysis]
          description: Present for workflow tasks; identifies the selected BeatAPI workflow.
          example: music-video
        effect_id:
          type: string
          description: Present for Effect tasks; stable selected Effect ID.
          example: video-muscle-max
        effect_version:
          type: integer
          description: Present for Effect tasks; immutable Effect version used for processing.
          example: 1
        media_type:
          type: string
          enum: [image, video]
          description: Present when task_kind is image or video.
        model:
          type: string
          description: Stable BeatAPI model alias. It is independent from internal execution routing.
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Current task lifecycle status. Stop polling at `succeeded` or `failed`; Music Video can also require manual action.
        stage:
          $ref: '#/components/schemas/TaskStatus'
          description: Always repeats `status`. Kept for compatibility; read `status`.
        storyboard:
          $ref: '#/components/schemas/Storyboard'
          description: Music Video storyboard metadata when available.
        created_at:
          type: integer
          description: Unix timestamp when BeatAPI accepted the task.
        updated_at:
          type: integer
          description: Unix timestamp of the latest task update.
        completed_at:
          type: [integer, 'null']
          description: Terminal Unix timestamp, or null while work is in progress.
        poll_after_seconds:
          type: integer
          description: >-
            Present while the task is running: how long to wait before the next status
            call (5 for images, 8 for video and Effects, 10 for workflows and data tasks).
            Follow it instead of a fixed interval.
            Absent on a terminal task.
          example: 8
        typical_seconds:
          type: object
          description: >-
            Present while the task is running, when enough recent finishes exist: how long
            this task's model recently took from accepted to succeeded, measured on this
            gateway. Past `p90` with no change the task is running long; there is no ETA
            beyond that.
          required: [p50, p90, samples, window]
          properties:
            p50: { type: integer, description: Median seconds. }
            p90: { type: integer, description: Ninetieth-percentile seconds. }
            samples: { type: integer, description: Finished tasks the figures rest on. }
            window: { type: string, description: 'The window measured, such as `7d`.' }
        output:
          description: Output is null until the task succeeds.
          oneOf:
            - type: 'null'
            - type: object
              required: [media, url, r2_url]
              properties:
                media:
                  type: array
                  description: BeatAPI-hosted result assets.
                  items:
                    type: object
                    required: [type, url, mime_type]
                    properties:
                      type:
                        type: string
                        enum: [image, video]
                        description: Result asset type.
                      url:
                        type: string
                        format: uri
                        description: BeatAPI-hosted HTTPS result URL.
                      mime_type:
                        type: string
                        description: Result asset MIME type.
                        examples: [video/mp4, image/png, image/jpeg, image/webp]
                url:
                  type: string
                  format: uri
                  description: The primary asset's URL, the one to read when you want a single file (the first video, else the first image). The same value as `r2_url`.
                r2_url:
                  type: string
                  format: uri
                  deprecated: true
                  description: Deprecated — read `url`. The same value as `url`, kept only for clients that already read it.
            - type: object
              required: [text, usage, finish_reason]
              properties:
                text:
                  type: string
                  description: Completed video analysis text.
                usage:
                  type: object
                  description: Measured token usage used for final USD settlement.
                  required: [input_tokens, output_tokens, total_tokens]
                  properties:
                    input_tokens:
                      type: integer
                      minimum: 0
                      description: Tokens consumed by the prompt and video input.
                    output_tokens:
                      type: integer
                      minimum: 0
                      description: Tokens consumed by visible output and model reasoning.
                    total_tokens:
                      type: integer
                      minimum: 0
                      description: Total measured input and output tokens.
                finish_reason:
                  type: [string, 'null']
                  description: Why the model stopped generating.
            - type: object
              description: 'A data task''s result: the capability''s own result object, such as `web.research` with `research_notes` and `sources` (in a view: `items`).'
              required: [object]
              additionalProperties: true
              properties:
                object:
                  type: string
                  description: The result type, such as `web.research`.
        usage:
          $ref: '#/components/schemas/TaskUsage'
          description: USD reservation, settlement, refund, and optional billable duration for this task.
        request_id:
          type: string
          description: Correlation ID to retain for logs and BeatAPI support.
          example: req_abc123
        error_code:
          type: [string, 'null']
          description: Machine-readable terminal failure code, or null when no task failure is recorded.
          example: processing_timeout
        error_message:
          type: [string, 'null']
          description: Human-readable terminal failure detail, or null when no task failure is recorded.
        error:
          type: object
          description: >-
            Present on a failed task: the terminal failure as one object. Its values are the
            same as the flat `error_code`, `error_message` and `retryable`, which stay.
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable failure code, the same value as `error_code`.
              example: content_policy_violation
            message:
              type: string
              description: English sentence that states the cause, the same value as `error_message`.
            retryable:
              type: boolean
              description: Whether resubmitting could succeed, the same value as `retryable`. Absent when `retryable` is absent.
        retryable:
          type: boolean
          description: >-
            Present on a failed task: whether resubmitting could succeed. True when the task
            failed on our side or timed out (a failed task is not charged); false when it was
            refused for content or bad input. Same code-to-retryable rule as the error envelope.
          example: true
