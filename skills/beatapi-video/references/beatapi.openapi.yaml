  /v1/account/usage/records/{id}:
    get:
      operationId: getUsageRecord
      tags: [Usage]
      x-apidog-folder: Reference/Usage & Limits
      summary: Get a usage record
      description: >-
        One usage record by task ID, or by the request ID a response carried in
        `X-BeatAPI-Request-Id` (`chatcmpl-<request ID>` also works). A task's amounts match
        `GET /v1/tasks/{task_id}`, including any settlement. Authenticate with the account's
        personal access token.
      security:
        - PersonalAccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: task_7Qm2Xc9LpR4vT8sKa1Nf6YbH3eWdJ0uZ
          description: Task ID or request ID.
      responses:
