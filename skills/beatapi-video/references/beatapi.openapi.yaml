        default_threshold_credits:
          type: number
          format: double
          description: The threshold used when `threshold_credits` is `0`.
        notification_email:
          type: string
          description: The address that receives notifications.
        account_email:
          type: string
          description: The account's own email address.
    NotificationSettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NotificationSettings'
    NotificationSettingsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          type: string
          enum: [email, none]
        threshold_credits:
          type: number
          format: double
          minimum: 0
          description: The balance in USD below which BeatAPI notifies you; `0` selects the default.
        notification_email:
          type: string
          description: The address that receives notifications.
    Payment:
