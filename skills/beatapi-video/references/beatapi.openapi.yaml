    TaskCallbackUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https://'
      description: >-
        Optional one-off webhook for this task: a public HTTPS URL of at most 2048 characters.
        It must have the same scheme, host and port as one of your enabled webhook endpoints,
        and that endpoint's `secret` signs the delivery, so register the endpoint first with
        `POST /v1/webhooks`. When the task succeeds or fails, BeatAPI sends `task.succeeded`
        or `task.failed` to this URL with the same body, headers and retry rules as an
        account webhook. If an account endpoint is also subscribed to the event, both
        receive it; when the URL is exactly that endpoint's URL, it is sent once. The
        callback stops when the signing endpoint is deleted, disabled or moved to another
        host. Workflows, Effects and Capabilities Run do not accept it.
        An invalid value is `400 bad_request` and the message names `callback_url`.
