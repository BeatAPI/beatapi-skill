  /v1/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      x-apidog-folder: Reference/Task Status
      summary: List tasks
      security:
        - BearerAuth: []
      description: |
        Lists this account's tasks, newest first. Each item is the task object `GET /v1/tasks/{task_id}` returns, so one parser reads both. Without filters it returns the latest tasks of every API key on the account.

        Pass `next_cursor` back as `cursor` to read the next page; the last page has no `next_cursor`. A cursor is opaque and works only for the account that read that page: an edited cursor, or one from another account, is `400 bad_request`.

        `status` filters by the lifecycle states `queued`, `processing`, `succeeded` and `failed`; `processing` also matches a workflow task whose `status` reads as a stage such as `storyboard_ready`. Calls that answer inside the response (social data, web, SEO) are not tasks and never appear in this list. An unknown query parameter is `400 bad_request`.
      parameters:
        - in: query
          name: status
          required: false
          description: 'Only tasks in these states. Repeat the parameter or separate the values with commas.'
          schema:
            type: array
            items: { type: string, enum: [queued, processing, succeeded, failed] }
          style: form
          explode: true
        - in: query
          name: model
          required: false
          description: 'Only tasks of this model, matched exactly on the model ID you sent, such as `nano-banana-2`.'
          schema: { type: string }
        - in: query
          name: created_after
          required: false
          description: 'Only tasks created at or after this time (inclusive), as Unix seconds or an RFC 3339 timestamp.'
          schema: { type: string }
        - in: query
          name: created_before
          required: false
          description: 'Only tasks created before this time (exclusive), as Unix seconds or an RFC 3339 timestamp. With `created_after`, adjacent ranges neither overlap nor leave a gap.'
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: Tasks per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          required: false
          description: The `next_cursor` of the previous page.
          schema: { type: string }
        - in: query
          name: api_key_id
          required: false
          description: Only tasks submitted with this API key (the `id` from `GET /v1/account/keys`). A key that is not yours gives an empty list.
          schema: { type: string }
      responses:
        '200':
          description: One page of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
              example:
                data:
                  object: list
                  data:
                    - id: task_8K2qA
                      object: task
                      task_kind: video
                      capability_id: seedance-2.5-flash
                      capability_version: 1
                      media_type: video
                      model: seedance-2.5-flash
                      status: succeeded
                      stage: succeeded
                      created_at: 1782210000
                      updated_at: 1782210300
                      completed_at: 1782210300
                      output:
                        media:
                          - type: video
                            url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                            mime_type: video/mp4
                        url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                        r2_url: https://media.beatapi.io/outputs/task_8K2qA/0.mp4
                      usage:
                        credits_reserved: 1.35
                        credits_charged: 1.35
                        billable_duration_seconds: 5
                        credits_settled: 1.35
                        credits_refunded: 0
                      request_id: req_abc123
                      error_code: null
                      error_message: null
                  has_more: true
                  next_cursor: eyJiIjoxMjM0NX0.Zm9vYmFy
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      tags: [Tasks]
      x-apidog-folder: Reference/Task Status
      summary: Poll task status
      security:
        - BearerAuth: []
      description: |
        Wait `poll_after_seconds` (present while the task runs; 5 for images, 8 for video and Effects, 10 for workflows and data tasks) between calls.

        A failed task is still HTTP `200`: read `status: "failed"` and `error` (`code`, `message`, `retryable`) in the body; the flat `error_code`, `error_message` and `retryable` carry the same values. A task that does not exist for this account answers `404 not_found`.
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
          example: task_8K2qA
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                queued:
                  summary: Accepted and waiting
                  value:
                    data:
                      id: task_8K2qA
                      object: task
