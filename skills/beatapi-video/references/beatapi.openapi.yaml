      description: |
        Transfer motion from one uploaded 3–30 second MP4/MOV video to one
        uploaded character image. Both URLs must come from `/v1/files` for the
        current BeatAPI account. BeatAPI detects the reference-video duration
        server-side and reserves USD at the selected per-second rate, rounding
        fractional seconds up. The image must be 10 MB or smaller; the video
        may be up to 100 MB.
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: kling-2.6-motion-control, description: Must be `kling-2.6-motion-control`. }
        prompt: { type: string, maxLength: 2500, description: Optional motion or scene guidance. }
        images:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one character-image URL returned by the current account's `/v1/files` upload.
          items: { type: string, format: uri, pattern: '^https://' }
        reference_videos:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one 3–30 second MP4/MOV URL returned by the current account's `/v1/files` upload. Its detected duration determines billing.
          items: { type: string, format: uri, pattern: '^https://' }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution and per-second price tier. }
        character_orientation: { type: string, enum: [image, video], default: image, description: Image orientation limits the output to at most 10 seconds; video orientation supports up to 30 seconds. }
    Kling3MotionControlVideoRequest:
      type: object
      additionalProperties: false
      required: [model, images, reference_videos]
      description: |
        Kling 3.0 motion transfer using exactly one uploaded image and one
        uploaded 3–30 second MP4/MOV. Both assets must exceed 340 px in width
        and height and use an aspect ratio from 2:5 to 5:2. BeatAPI detects the
        reference-video duration server-side and reserves USD at the selected
        per-second rate, rounding fractional seconds up.
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: kling-3-motion-control, description: Must be `kling-3-motion-control`. }
        prompt: { type: string, maxLength: 2500, description: Optional motion or scene guidance. }
        images:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one character-image URL returned by the current account's `/v1/files` upload; maximum 10 MB.
          items: { type: string, format: uri, pattern: '^https://' }
        reference_videos:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one 3–30 second MP4/MOV URL returned by the current account's `/v1/files` upload; maximum 100 MB. Its detected duration determines billing.
          items: { type: string, format: uri, pattern: '^https://' }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution and per-second price tier. }
        character_orientation: { type: string, enum: [image, video], default: image, description: Image orientation limits the output to at most 10 seconds; video orientation supports up to 30 seconds. }
        background_source: { type: string, enum: [input_video, input_image], default: input_video, description: Preserve the background from the motion video or character image. }
    Wan30VideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Renders 2–30 seconds in a single pass. `images` starts the render from a picture; reference videos and audio travel alongside it.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: wan-3.0, description: Must be `wan-3.0`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: Video generation instructions. }
        images: { type: array, minItems: 1, maxItems: 10, description: Public HTTPS images. One starts an image-to-video render; more are used as visual references., items: { type: string, format: uri, pattern: '^https://' } }
        reference_videos: { type: array, minItems: 1, maxItems: 5, description: 'Public HTTPS video references. Their seconds, rounded up, are billed with the output seconds at the same rate.', items: { type: string, format: uri, pattern: '^https://' } }
        reference_audios: { type: array, minItems: 1, maxItems: 5, description: Public HTTPS audio references., items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 2, maximum: 30, default: 5, description: Requested output duration in seconds. Any whole number in range; there is no long-clip surcharge. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4'], default: '16:9', description: Output video aspect ratio. }
        resolution: { type: string, enum: [480p, 720p, 1080p], default: 720p, description: Output resolution tier. Price scales with it. }
    Wan30PrimeVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Renders 4–30 seconds in a single pass. `images` starts the render from a picture; reference videos and audio travel alongside it.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: wan-3.0-prime, description: Must be `wan-3.0-prime`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: Video generation instructions. }
        images: { type: array, minItems: 1, maxItems: 10, description: Public HTTPS images. One starts an image-to-video render; more are used as visual references., items: { type: string, format: uri, pattern: '^https://' } }
        reference_videos: { type: array, minItems: 1, maxItems: 5, description: Public HTTPS video references. A request that carries one is billed at 1.5x., items: { type: string, format: uri, pattern: '^https://' } }
        reference_audios: { type: array, minItems: 1, maxItems: 5, description: Public HTTPS audio references., items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 4, maximum: 30, default: 5, description: Requested output duration in seconds. Any whole number in range; there is no long-clip surcharge. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4'], default: '16:9', description: Output video aspect ratio. }
        resolution: { type: string, enum: [480p, 720p, 1080p], default: 720p, description: Output resolution tier. Price scales with it. }
    HappyHorse10VideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, images]
      description: 'Image to video only — this model publishes no text-to-video mode, so `images` is required.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: happyhorse-1.0, description: Must be `happyhorse-1.0`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What should happen in the shot — the motion, the expression, the camera.' }
        images: { type: array, minItems: 1, maxItems: 9, description: Source images as public HTTPS URLs. At least one is required., items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 3, maximum: 15, default: 5, description: Requested output duration in seconds. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4'], default: '16:9', description: Output video aspect ratio. }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution tier. Price scales with it. }
    HappyHorse11VideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Text to video when no image is sent; image to video when `images` carries one first frame, whose aspect ratio the output keeps; reference to video with one to nine `reference_images`. `images` cannot be combined with `reference_images`.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: happyhorse-1.1, description: Must be `happyhorse-1.1`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What should happen in the shot — the motion, the expression, the camera. Refer to reference images as [Image 1], [Image 2] and so on, in list order.' }
        images: { type: array, minItems: 1, maxItems: 1, description: One first-frame image as a public HTTPS URL. The output keeps its aspect ratio., items: { type: string, format: uri, pattern: '^https://' } }
        reference_images: { type: array, minItems: 1, maxItems: 9, description: 'One to nine reference images as public HTTPS URLs, referred to in the prompt as [Image 1], [Image 2] and so on.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 3, maximum: 15, default: 5, description: Requested output duration in seconds. }
        aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4'], default: '16:9', description: Output video aspect ratio for text and reference runs. A first frame in `images` sets the shape instead. }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution tier. Price scales with it. }
    MinimaxH3MaxVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Text to video, or image to video when `images` carries a first frame. A second image becomes the last frame. Output tops out at 1080p — MiniMax H3 renders 2K for less per second.'
      properties:
        callback_url: { $ref: '#/components/schemas/TaskCallbackUrl' }
        model: { type: string, const: minimax-h3-max, description: Must be `minimax-h3-max`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: 'What should happen in the shot — the motion, the expression, the camera.' }
        images: { type: array, minItems: 1, maxItems: 2, description: 'Public HTTPS images. One starts the render from a first frame; a second becomes the last frame, in first-to-last order.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 5, maximum: 15, default: 5, description: 'Requested output duration in seconds, a whole number from 5 to 15. Billed per second at the rate for the chosen resolution.' }
        resolution: { type: string, enum: ['480p', '768p', '1080p'], default: '768p', description: 'Output resolution, one of the three values this model accepts. Price scales with it.' }
        seed: { type: integer, minimum: 0, maximum: 4294967295, description: Reuse a seed to re-render the same motion. A random seed is chosen when omitted. }
    MinimaxH3MaxTurboVideoRequest:
      type: object
      additionalProperties: false
