          type: object
          required: [object, data, has_more]
          properties:
            object:
              type: string
              enum: [list]
            data:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            has_more:
              type: boolean
            next_cursor:
              type: string
              description: Pass as `cursor` to read the next page; absent on the last page.
    ApiKey:
      type: object
      required: [object, id, title, key_prefix, status, created_at, last_used_at, expires_at, remaining_credits, credits_used, models, allowed_ips]
      properties:
        object:
          type: string
          enum: [api_key]
        id: { type: string }
        title: { type: string }
        key_prefix:
          type: string
          description: The first characters of the key. The full key is never returned here.
        status:
          type: string
          enum: [active, disabled, expired, exhausted]
        created_at:
          type: integer
          description: Unix seconds.
        last_used_at:
          type: [integer, 'null']
          description: Unix seconds; `null` while unused.
        expires_at:
          type: [integer, 'null']
          description: Unix seconds; `null` for a key that never expires.
        remaining_credits:
          type: [number, 'null']
          format: double
          description: Spending left in USD; `null` for unlimited.
        credits_used:
          type: number
          format: double
          description: USD spent through this key.
        models:
          type: array
          description: Public model IDs the key may call; empty means every model.
          items: { type: string }
        allowed_ips:
          type: array
          description: IP addresses allowed to use the key; empty means any.
          items: { type: string }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full API key. It appears only in this response.
    ApiKeyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ApiKey'
    ApiKeyCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ApiKeyCreated'
    ApiKeyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [object, data, has_more]
          properties:
            object:
              type: string
              enum: [list]
            data:
              type: array
              items:
                $ref: '#/components/schemas/ApiKey'
            has_more:
              type: boolean
            next_cursor:
              type: string
              description: Pass as `cursor` to read the next page; absent on the last page.
    ApiKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string }
        expires_at:
          type: integer
          description: Unix seconds; omit for a key that never expires.
        remaining_credits:
          type: number
          format: double
          description: Spending cap in USD; omit for unlimited.
        models:
          type: array
          description: Public model IDs the key may call; omit or leave empty for every model.
          items: { type: string }
        allowed_ips:
          type: array
          description: IP addresses allowed to use the key; omit or leave empty for any.
          items: { type: string }
    ApiKeyUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string }
        status:
          type: string
          enum: [active, disabled]
        expires_at:
          type: [integer, 'null']
          description: Unix seconds; `null` for a key that never expires.
        remaining_credits:
          type: [number, 'null']
          format: double
          description: Spending cap in USD; `null` for unlimited.
        models:
          type: array
          description: Public model IDs the key may call; `[]` for every model.
          items: { type: string }
        allowed_ips:
          type: array
          description: IP addresses allowed to use the key; `[]` for any.
          items: { type: string }
    ApiKeyDeletedResponse:
      type: object
      required: [data]
