  /v1/effects/tasks:
    post:
      operationId: createEffectTask
      tags: [Effects]
      summary: Create an Effect task
      security: [{ BearerAuth: [] }]
      description: |
        Creates an asynchronous image or video Effect task. Read the catalog
        first: image count, accepted input types, output resolution/duration,
        and execution contract are fixed by the selected Effect version. Send
        an `Idempotency-Key`; an exact replay returns the
        accepted task before remote input URLs are revalidated, while a changed
        body returns `idempotency_conflict`.

        The USD amount is reserved atomically when accepted, settled on success, and
        fully refunded after a definite processing failure. An uncertain create
        result is not blindly retried and never switches integrations automatically.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: 'Optional, up to 255 characters (longer is `400 bad_request`). Within 24 hours, the same key with the identical request replays the first successful response with `Idempotent-Replayed: true`; the same key with a different body or path returns `409 idempotency_conflict`, as does a key whose first request is still running. Non-2xx responses are not stored.'
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effect_id, images]
              properties:
                effect_id: { type: string, example: video-muscle-max, description: Stable published Effect ID from `GET /v1/effects`. }
                effect_version:
                  type: integer
                  minimum: 1
                  description: Optional immutable version. Omit to use the current published version.
                images:
                  type: array
                  minItems: 1
                  maxItems: 7
                  description: Public HTTPS input images in the order required by the selected Effect version. Read `GET /v1/effects/{effect_id}` for the exact count and accepted media rules; upload local files with `POST /v1/files`.
                  items: { type: string, format: uri }
                options:
                  type: object
                  additionalProperties: false
                  description: Optional controls supported by the selected Effect version. Omit unsupported controls; the catalog is the source of truth.
                  properties:
                    aspect_ratio: { type: string, description: Requested output aspect ratio when the selected Effect exposes this option. }
                    resolution: { type: string, description: Requested output resolution when the selected Effect exposes this option. }
                    duration: { type: integer, description: Requested video duration in seconds when the selected Effect exposes this option. }
                    bgm: { type: boolean, description: Include background music when supported by the selected Effect. }
                    seed: { type: integer, description: Optional deterministic seed when supported by the selected Effect. }
            example:
              effect_id: video-muscle-max
              images: ['https://cdn.beatapi.io/samples/neon-singer.png']
              options: { resolution: 720p, duration: 12 }
      responses:
        '201':
          description: Effect task accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
              example:
                data:
                  id: task_effect123
                  object: task
                  task_kind: effect
                  capability_id: video-muscle-max
                  capability_version: 1
                  effect_id: video-muscle-max
                  effect_version: 1
                  status: queued
                  stage: queued
                  created_at: 1782210000
                  updated_at: 1782210000
                  completed_at: null
                  output: null
                  usage: { credits_reserved: 1.2, credits_charged: 1.2, credits_settled: 0, credits_refunded: 0 }
                  request_id: req_effect123
                  error_code: null
                  error_message: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Effect or requested version is unavailable (`not_found`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ProcessingUnavailable' }

  /v1/video-analysis/tasks:
    post:
      operationId: createVideoAnalysisTask
      tags: [Video Analysis]
      x-apidog-folder: Video Analysis API
      summary: Analyze an uploaded video
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Optional retry key. Reusing the same key with the same normalized request returns the accepted task.
          example: video-analysis-cus_123-01
      description: |
        Analyze one MP4 or MOV previously uploaded with `POST /v1/files` by the
        current BeatAPI account. `standard` is the default low-cost route;
        `deep` uses the higher-reasoning route. BeatAPI reserves an estimate from
        verified video duration and the output budget, then settles from actual
        input and output token usage. Standard costs $0.36 per 1M input tokens and
        $1.60 per 1M output tokens; Deep costs $0.72 per 1M input tokens and $5.00
        per 1M output tokens. Each completed task is rounded up to the nearest
        $0.01 because the shared USD balance settles in cents. Save `data.id` and poll the shared Task
        endpoint if the task remains queued for processing capacity.
      requestBody:
